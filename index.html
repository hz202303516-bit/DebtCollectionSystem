                            <span style={{fontSize:'0.75rem',background:'#e8f0fe',color:'#1967d2',padding:'3px 10px',borderRadius:'20px',fontWeight:500}}>6-Factor Weighted Model</span>
                        </div>
                        <div className="alert alert-info" style={{marginBottom:'16px',fontSize:'0.85rem'}}>
                            ℹ️ Risk scores: Days Past Due (28%), Loan Utilization (20%), Payment Frequency (18%), Overdue Loans (15%), Debt Load (12%), GPS Availability (7%).
                        </div>
                        <MLRiskDashboard />
                    </div>
                )}
            </div>

            {/* Review Modal */}
            {reviewModal && (
                <div className="modal-overlay active" onClick={e => { if (e.target === e.currentTarget) setReviewModal(null); }}>
                    <div className="modal">
                        <div className="modal-header">
                            <h3>📋 Review Loan Application</h3>
                            <button className="modal-close" onClick={() => setReviewModal(null)}>×</button>
                        </div>
                        <div style={{background:'#f8f9fa',borderRadius:'8px',padding:'14px',marginBottom:'16px'}}>
                            <p><strong>Borrower:</strong> {reviewModal.borrower_name}</p>
                            <p><strong>Requested Amount:</strong> {fmtCurrency(reviewModal.requested_amount)}</p>
                            <p><strong>Requested Interest:</strong> {reviewModal.requested_interest_rate}%</p>
                            <p><strong>Requested Due Date:</strong> {fmtDate(reviewModal.requested_due_date)}</p>
                            {reviewModal.purpose && <p><strong>Purpose:</strong> {reviewModal.purpose}</p>}
                        </div>
                        {msg && <Alert type={msg.type} onDismiss={clearMsg}>{msg.text}</Alert>}
                        <form onSubmit={submitReview}>
                            <div className="form-group">
                                <label className="form-label">Decision <span className="required">*</span></label>
                                <div style={{display:'flex',gap:'12px'}}>
                                    <label style={{display:'flex',alignItems:'center',gap:'8px',cursor:'pointer',padding:'10px 16px',border:'2px solid',borderColor: reviewForm.status==='approved'?'#0d904f':'var(--border)',borderRadius:'8px',flex:1,justifyContent:'center',background:reviewForm.status==='approved'?'#e6f4ea':'white'}}>
                                        <input type="radio" name="decision" value="approved" checked={reviewForm.status==='approved'} onChange={()=>setReviewForm(f=>({...f,status:'approved'}))} /> ✅ Approve
                                    </label>
                                    <label style={{display:'flex',alignItems:'center',gap:'8px',cursor:'pointer',padding:'10px 16px',border:'2px solid',borderColor: reviewForm.status==='rejected'?'#c5221f':'var(--border)',borderRadius:'8px',flex:1,justifyContent:'center',background:reviewForm.status==='rejected'?'#fce8e6':'white'}}>
                                        <input type="radio" name="decision" value="rejected" checked={reviewForm.status==='rejected'} onChange={()=>setReviewForm(f=>({...f,status:'rejected'}))} /> ❌ Reject
                                    </label>
                                </div>
                            </div>
                            {reviewForm.status === 'approved' && (
                                <>
                                    <p style={{fontSize:'0.82rem',color:'var(--text-secondary)',marginBottom:'12px'}}>You may adjust the final terms below:</p>
                                    <div className="form-row">
                                        <div className="form-group">
                                            <label className="form-label">Final Amount (₱) <span className="required">*</span></label>
                                            <input className="form-input" type="number" min="1" step="0.01" required value={reviewForm.final_amount} onChange={e=>setReviewForm(f=>({...f,final_amount:e.target.value}))} />
                                        </div>
                                        <div className="form-group">
                                            <label className="form-label">Interest Rate (%) <span className="required">*</span></label>
                                            <input className="form-input" type="number" min="0" max="100" step="0.01" required value={reviewForm.final_interest_rate} onChange={e=>setReviewForm(f=>({...f,final_interest_rate:e.target.value}))} />
                                            <p className="form-hint">Must be 0–100%. Cannot be negative.</p>
                                        </div>
                                    </div>
                                    <div className="form-group">
                                        <label className="form-label">Due Date <span className="required">*</span></label>
                                        <input className="form-input" type="date" required min={new Date().toISOString().split('T')[0]} value={reviewForm.final_due_date} onChange={e=>setReviewForm(f=>({...f,final_due_date:e.target.value}))} />
                                    </div>
                                </>
                            )}
                            <div className="form-group">
                                <label className="form-label">Admin Notes {reviewForm.status === 'rejected' ? <span className="required">*</span> : <span className="text-muted">(optional)</span>}</label>
                                <textarea className="form-textarea" placeholder={reviewForm.status === 'rejected' ? 'Reason for rejection...' : 'Any notes for the borrower...'} required={reviewForm.status === 'rejected'} value={reviewForm.admin_notes} onChange={e=>setReviewForm(f=>({...f,admin_notes:e.target.value}))} />
                            </div>
                            <div style={{display:'flex',gap:'10px'}}>
                                <button className="btn btn-outline" type="button" onClick={()=>setReviewModal(null)}>Cancel</button>
                                <button className={`btn ${reviewForm.status==='approved'?'btn-success':'btn-danger'} btn-block`} type="submit" disabled={!reviewForm.status}>
                                    {reviewForm.status === 'approved' ? '✅ Approve & Create Loan' : reviewForm.status === 'rejected' ? '❌ Reject Application' : 'Select a decision first'}
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            )}

            {/* Assign Collector Modal */}
            <div className={`modal-overlay ${showAssignModal ? 'active' : ''}`} onClick={e => { if (e.target === e.currentTarget) setShowAssignModal(false); }}>
                <div className="modal">
                    <div className="modal-header"><h3>👤 Assign Collector</h3><button className="modal-close" onClick={() => setShowAssignModal(false)}>×</button></div>
                    <form onSubmit={assignCollector}>
                        <div className="form-group">
                            <label className="form-label">Borrower <span className="required">*</span></label>
                            <select className="form-select" value={assignForm.borrower_id} onChange={e => setAssignForm({...assignForm, borrower_id: e.target.value})} required>
                                <option value="">Select borrower</option>
                                {borrowers.filter(b => !b.collector_id).map(b => <option key={b.borrower_id} value={b.borrower_id}>{b.full_name} — {b.city||'No city'}</option>)}
                            </select>
                            {borrowers.filter(b => !b.collector_id).length === 0 && <p className="form-hint">All borrowers are already assigned.</p>}
                        </div>
                        <div className="form-group">
                            <label className="form-label">Collector <span className="required">*</span></label>
                            <select className="form-select" value={assignForm.collector_id} onChange={e => setAssignForm({...assignForm, collector_id: e.target.value})} required>
                                <option value="">Select collector</option>
                                {collectors.map(c => <option key={c.user_id} value={c.user_id}>{c.name}</option>)}
                            </select>
                            {collectors.length === 0 && <p className="form-hint" style={{color:'var(--danger)'}}>No approved collectors available. Approve a collector first.</p>}
                        </div>
                        <button className="btn btn-primary btn-block" type="submit" disabled={collectors.length === 0}>Assign Collector</button>
                    </form>
                </div>
            </div>
        </div>
    );
}

// ==================== COLLECTOR PANEL ====================
function CollectorPanel({ user, onLogout, setPage }) {
    const [borrowers, setBorrowers] = useState([]);
    const [loans, setLoans] = useState([]);
    const [payAmount, setPayAmount] = useState({});
    const [gps, setGps] = useState({});
    const [msg, setMsg, clearMsg] = useMsg();

    useEffect(() => { loadData(); }, []);

    const loadData = async () => {
        try {
            const borrowersRes = await API.get('/api/borrowers').catch(err => {
                console.error('Failed to load borrowers:', err);
                return { data: [] };
            });
            setBorrowers(borrowersRes.data);

            const loansRes = await API.get('/api/loans').catch(err => {
                console.error('Failed to load loans:', err);
                return { data: [] };
            });
            setLoans(loansRes.data);
            
        } catch (e) {
            console.error('Data loading error:', e);
            setMsg('error', 'Failed to load data');
        }
    };

    const recordPayment = async (loanId, balance) => {
        const amount = payAmount[loanId];
        if (!amount || amount.toString().trim() === '') return setMsg('error', 'Please enter a payment amount');
        if (parseFloat(amount) <= 0) return setMsg('error', 'Payment amount must be greater than 0');
        if (parseFloat(amount) > parseFloat(balance)) return setMsg('error', `Amount exceeds balance of ${fmtCurrency(balance)}`);
        try {
            const res = await API.post('/api/payments', { loan_id: loanId, amount: parseFloat(amount), latitude: gps.latitude, longitude: gps.longitude });
            setMsg('success', `Payment recorded! Receipt: ${res.data.receipt}. New balance: ${fmtCurrency(res.data.newBalance)}`);
            setPayAmount(p => ({...p, [loanId]: ''}));
            loadData();
        } catch (e) { setMsg('error', e.response?.data?.error || 'Payment failed'); }
    };

    const getGps = () => {
        if (!navigator.geolocation) return setMsg('error', 'Geolocation not supported on this device');
        navigator.geolocation.getCurrentPosition(
            pos => { setGps({ latitude: pos.coords.latitude, longitude: pos.coords.longitude }); setMsg('success', 'GPS location acquired!'); },
            err => {
                const m = err.code === 1 ? 'GPS permission denied. Payment will be recorded without location.' : 'Could not get GPS location. Please try again.';
                setMsg('warning', m);
            },
            { enableHighAccuracy: true, timeout: 10000 }
        );
    };

    const activeLoans = loans.filter(l => l.status === 'active');

    return (
        <div>
            <nav className="navbar">
                <span className="navbar-brand">📍 Collector Panel</span>
                <div className="navbar-actions">
                    <span className={`gps-indicator ${gps.latitude ? 'gps-active' : 'gps-inactive'}`}>
                        <span className={`gps-dot ${gps.latitude ? 'active' : 'inactive'}`}></span>
                        {gps.latitude ? `GPS: ${gps.latitude.toFixed(4)}` : 'GPS Inactive'}
                    </span>
                    <button className="btn btn-outline btn-sm" onClick={getGps}>📍 Get GPS</button>
                    <button className="btn btn-outline btn-sm" onClick={() => setPage('dashboard')}>📊 Dashboard</button>
                    <button className="btn btn-danger btn-sm" onClick={onLogout}>🚪 Logout</button>
                </div>
            </nav>
            <div className="container">
                {msg && <Alert type={msg.type} onDismiss={clearMsg}>{msg.text}</Alert>}
                {!gps.latitude && (
                    <div className="alert alert-warning mb-2">
                        ⚠️ GPS not active. Click "Get GPS" to tag payments with your location. Payments can still be recorded without GPS.
                    </div>
                )}
                <div className="card">
                    <div className="card-header">My Assigned Borrowers ({borrowers.length})</div>
                    <div className="table-container">
                        <table className="table">
                            <thead><tr><th>Name</th><th>Address</th><th>Location</th><th>Map</th></tr></thead>
                            <tbody>
                                {borrowers.map(b => (
                                    <tr key={b.borrower_id}>
                                        <td><strong>{b.full_name}</strong></td>
                                        <td style={{fontSize:'0.85rem'}}>{[b.street,b.barangay,b.city].filter(Boolean).join(', ')||'N/A'}</td>
                                        <td>
                                            {b.latitude ? <span className="gps-indicator gps-active" style={{fontSize:'0.78rem'}}><span className="gps-dot active"></span>Live GPS</span>
                                                : b.geocoded_lat ? <span className="gps-indicator gps-geocoded" style={{fontSize:'0.78rem'}}><span className="gps-dot geocoded"></span>Addr. est.</span>
                                                : <span className="gps-indicator gps-inactive" style={{fontSize:'0.78rem'}}><span className="gps-dot inactive"></span>None</span>}
                                        </td>
                                        <td>
                                            {(b.latitude || b.geocoded_lat) && (
                                                <a href={`https://www.google.com/maps?q=${b.latitude||b.geocoded_lat},${b.longitude||b.geocoded_lng}`} target="_blank" className="btn btn-outline btn-sm">🗺️ Map</a>
                                            )}
                                        </td>
                                    </tr>
                                ))}
                                {borrowers.length === 0 && <tr><td colSpan="4" style={{textAlign:'center',color:'var(--text-secondary)',padding:'20px'}}>No assigned borrowers</td></tr>}
                            </tbody>
                        </table>
                    </div>
                </div>
                <div className="card mt-3">
                    <div className="card-header">Active Loans to Collect ({activeLoans.length})</div>
                    <div className="table-container">
                        <table className="table">
                            <thead><tr><th>Borrower</th><th>Loan Amount</th><th>Balance</th><th>Due Date</th><th>Record Payment</th></tr></thead>
                            <tbody>
                                {activeLoans.map(l => {
                                    const isOverdue = new Date(l.due_date) < new Date();
                                    return (
                                        <tr key={l.loan_id}>
                                            <td><strong>{l.borrower_name}</strong></td>
                                            <td>{fmtCurrency(l.loan_amount)}</td>
                                            <td><strong style={{color: isOverdue ? '#c5221f' : 'inherit'}}>{fmtCurrency(l.balance)}</strong></td>
                                            <td style={{fontSize:'0.85rem'}}>
                                                {fmtDate(l.due_date)}
                                                {isOverdue && <span className="badge badge-danger" style={{marginLeft:'6px',fontSize:'0.68rem'}}>OVERDUE</span>}
                                            </td>
                                            <td>
                                                <div style={{display:'flex',gap:'8px',alignItems:'center'}}>
                                                    <input type="number" className="form-input" style={{width:'110px',padding:'8px'}} placeholder="Amount" min="0.01" step="0.01" max={l.balance}
                                                        value={payAmount[l.loan_id]||''} onChange={e => setPayAmount(p => ({...p, [l.loan_id]: e.target.value}))} />
                                                    <button className="btn btn-success btn-sm" onClick={() => recordPayment(l.loan_id, l.balance)}>💰 Pay</button>
                                                </div>
                                            </td>
                                        </tr>
                                    );
                                })}
                                {activeLoans.length === 0 && <tr><td colSpan="5" style={{textAlign:'center',color:'var(--text-secondary)',padding:'20px'}}>No active loans to collect</td></tr>}
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    );
}

// ==================== BORROWER PANEL ====================
function BorrowerPanel({ user, onLogout, setPage }) {
    const [loans, setLoans] = useState([]);
    const [applications, setApplications] = useState([]);
    const [payments, setPayments] = useState([]);
    const [tab, setTab] = useState('apply');
    const [form, setForm] = useState({ requested_amount: '', requested_interest_rate: '', requested_due_date: '', purpose: '' });
    const [msg, setMsg, clearMsg] = useMsg();
    const [loading, setLoading] = useState(false);
    const [gps, setGps] = useState({ latitude: null, longitude: null, status: 'idle' });

    useEffect(() => { loadData(); tryGetLocation(); }, []);

    const loadData = async () => {
        try {
            const loansRes = await API.get('/api/loans').catch(err => {
                console.error('Failed to load loans:', err);
                return { data: [] };
            });
            setLoans(loansRes.data);

            const paymentsRes = await API.get('/api/payments').catch(err => {
                console.error('Failed to load payments:', err);
                return { data: [] };
            });
            setPayments(paymentsRes.data);

            const appsRes = await API.get('/api/loan-applications').catch(err => {
                console.error('Failed to load applications:', err);
                return { data: [] };
            });
            setApplications(appsRes.data);
            
        } catch (e) {
            console.error('Data loading error:', e);
            setMsg('error', 'Failed to load your data');
        }
    };

    const tryGetLocation = () => {
        if (!navigator.geolocation) return;
        setGps(g => ({...g, status: 'getting'}));
        navigator.geolocation.getCurrentPosition(
            async (pos) => {
                const lat = pos.coords.latitude, lng = pos.coords.longitude;
                setGps({ latitude: lat, longitude: lng, status: 'active' });
                try { await API.put('/api/gps/update-location', { latitude: lat, longitude: lng }); }
                catch (e) { /* silent fail */ }
            },
            () => { setGps(g => ({...g, status: 'denied'})); }
        );
    };

    const validateForm = () => {
        if (!form.requested_amount || parseFloat(form.requested_amount) <= 0) return 'Loan amount must be greater than 0';
        if (parseFloat(form.requested_amount) > 10000000) return 'Loan amount cannot exceed ₱10,000,000';
        const rate = form.requested_interest_rate === '' ? 0 : parseFloat(form.requested_interest_rate);
        if (isNaN(rate) || rate < 0) return 'Interest rate cannot be negative';
        if (rate > 100) return 'Interest rate cannot exceed 100%';
        if (!form.requested_due_date) return 'Please select a repayment due date';
        if (new Date(form.requested_due_date) <= new Date()) return 'Due date must be a future date';
        return null;
    };

    const submitApplication = async (e) => {
        e.preventDefault();
        clearMsg();
        const err = validateForm();
        if (err) return setMsg('error', err);
        setLoading(true);
        try {
            const payload = { ...form, requested_interest_rate: form.requested_interest_rate === '' ? 0 : parseFloat(form.requested_interest_rate) };
            const res = await API.post('/api/loan-applications', payload);
            setMsg('success', res.data.message || 'Application submitted! Waiting for admin review.');
            setForm({ requested_amount: '', requested_interest_rate: '', requested_due_date: '', purpose: '' });
            loadData();
            setTab('applications');
        } catch (e) { setMsg('error', e.response?.data?.error || 'Failed to submit application. Please try again.'); }
        finally { setLoading(false); }
    };

    const hasPending = applications.some(a => a.status === 'pending');
    const minDate = new Date(); minDate.setDate(minDate.getDate() + 1);
    const minDateStr = minDate.toISOString().split('T')[0];

    return (
        <div>
            <nav className="navbar">
                <span className="navbar-brand">📍 My Loan Portal</span>
                <div className="navbar-actions">
                    <span className={`gps-indicator ${gps.status==='active'?'gps-active':gps.status==='denied'?'gps-inactive':'gps-geocoded'}`}>
                        <span className={`gps-dot ${gps.status==='active'?'active':gps.status==='denied'?'inactive':'geocoded'}`}></span>
                        {gps.status==='active' ? 'Location shared' : gps.status==='denied' ? 'Location denied — using address' : gps.status==='getting' ? 'Getting GPS...' : 'No GPS'}
                    </span>
                    <button className="btn btn-outline btn-sm" onClick={() => setPage('dashboard')}>📊 Dashboard</button>
                    <button className="btn btn-danger btn-sm" onClick={onLogout}>🚪 Logout</button>
                </div>
            </nav>
            <div className="container">
                {msg && <Alert type={msg.type} onDismiss={clearMsg}>{msg.text}</Alert>}

                {gps.status === 'denied' && (
                    <div className="gps-fallback-box mb-2">
                        <strong>📍 GPS not shared — your location is estimated from your address</strong>
                        Your collector can still find you using your registered address. You can also enable location from your browser settings.
                    </div>
                )}

                <div className="tabs">
                    <button className={`tab ${tab==='apply'?'active':''}`} onClick={() => setTab('apply')}>📝 Apply for Loan</button>
                    <button className={`tab ${tab==='applications'?'active':''}`} onClick={() => setTab('applications')}>📄 My Applications {applications.filter(a=>a.status==='pending').length > 0 && <span className="tab-badge">{applications.filter(a=>a.status==='pending').length}</span>}</button>
                    <button className={`tab ${tab==='loans'?'active':''}`} onClick={() => setTab('loans')}>💰 My Loans</button>
                    <button className={`tab ${tab==='payments'?'active':''}`} onClick={() => setTab('payments')}>💳 Payments</button>
                </div>

                {/* ── APPLY ── */}
                {tab === 'apply' && (
                    <div className="card">
                        <div className="card-header">📝 Submit a Loan Application</div>
                        {hasPending && (
                            <div className="alert alert-warning">
                                ⚠️ You already have a <strong>pending application</strong>. Please wait for admin review before submitting another one.
                            </div>
                        )}
                        <form onSubmit={submitApplication}>
                            <div className="form-row">
                                <div className="form-group">
                                    <label className="form-label">Loan Amount (₱) <span className="required">*</span></label>
                                    <input className={`form-input ${form.requested_amount && parseFloat(form.requested_amount) <= 0 ? 'error' : ''}`} type="number" min="1" step="0.01" max="10000000" placeholder="e.g. 10000" required value={form.requested_amount} onChange={e => setForm(f => ({...f, requested_amount: e.target.value}))} disabled={hasPending} />
                                    <p className="form-hint">Minimum: ₱1 | Maximum: ₱10,000,000</p>
                                </div>
                                <div className="form-group">
                                    <label className="form-label">Proposed Interest Rate (%) <span style={{fontSize:'0.78rem',color:'var(--text-secondary)'}}>(optional)</span></label>
                                    <input className={`form-input ${form.requested_interest_rate && parseFloat(form.requested_interest_rate) < 0 ? 'error' : ''}`} type="number" min="0" max="100" step="0.01" placeholder="e.g. 5 (or leave blank for 0%)" value={form.requested_interest_rate} onChange={e => setForm(f => ({...f, requested_interest_rate: e.target.value}))} disabled={hasPending} />
                                    <p className="form-hint">Must be 0–100%. Admin may adjust the final rate.</p>
                                </div>
                            </div>
                            <div className="form-group">
                                <label className="form-label">Requested Repayment Date <span className="required">*</span></label>
                                <input className="form-input" type="date" required min={minDateStr} value={form.requested_due_date} onChange={e => setForm(f => ({...f, requested_due_date: e.target.value}))} disabled={hasPending} />
                                <p className="form-hint">Must be at least tomorrow or later. Admin may adjust the final date.</p>
                            </div>
                            <div className="form-group">
                                <label className="form-label">Purpose / Reason <span style={{fontSize:'0.78rem',color:'var(--text-secondary)'}}>(optional)</span></label>
                                <textarea className="form-textarea" placeholder="e.g. Medical expenses, school tuition, home repair..." value={form.purpose} onChange={e => setForm(f => ({...f, purpose: e.target.value}))} disabled={hasPending} />
                            </div>
                            <button className="btn btn-primary btn-block btn-lg" type="submit" disabled={loading || hasPending}>
                                {loading ? '⏳ Submitting...' : hasPending ? '⏳ Application Pending Admin Review' : '📤 Submit Loan Application'}
                            </button>
                        </form>
                    </div>
                )}

                {/* ── APPLICATIONS ── */}
                {tab === 'applications' && (
                    <div className="card">
                        <div className="card-header">📄 My Loan Applications</div>
                        {applications.length === 0 ? (
                            <p className="text-muted">No applications yet. Go to "Apply for Loan" to get started.</p>
                        ) : (
                            applications.map(a => (
                                <div key={a.application_id} className={`app-status-card ${a.status}`}>
                                    <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}>
                                        <div className="app-status-title">
                                            {a.status === 'pending' ? '⏳' : a.status === 'approved' ? '✅' : '❌'} {fmtCurrency(a.requested_amount)} Loan
                                        </div>
                                        <span className={`badge ${a.status==='approved'?'badge-success':a.status==='pending'?'badge-warning':'badge-danger'}`}>{a.status.toUpperCase()}</span>
                                    </div>
                                    <div className="app-status-meta">
                                        <span>Interest: {a.requested_interest_rate}%</span>
                                        <span>Due: {fmtDate(a.requested_due_date)}</span>
                                        <span>Submitted: {fmtDate(a.created_at)}</span>
                                    </div>
                                    {a.purpose && <p style={{fontSize:'0.82rem',marginTop:'6px',color:'var(--text-secondary)'}}>Purpose: {a.purpose}</p>}
                                    {a.status === 'pending' && <p style={{fontSize:'0.82rem',marginTop:'8px',color:'#b06000'}}>⏳ Your application is under review. Please wait for admin approval.</p>}
                                    {a.status === 'approved' && <p style={{fontSize:'0.82rem',marginTop:'8px',color:'#137333'}}>✅ Approved! Check "My Loans" to view the active loan.</p>}
                                    {a.admin_notes && <p style={{fontSize:'0.82rem',marginTop:'6px',background:'white',padding:'8px',borderRadius:'6px'}}>📝 Admin note: {a.admin_notes}</p>}
                                </div>
                            ))
                        )}
                    </div>
                )}

                {/* ── LOANS ── */}
                {tab === 'loans' && (
                    <div className="card">
                        <div className="card-header">💰 My Active Loans</div>
                        {loans.length === 0 ? (
                            <p className="text-muted">No loans yet. Submit an application to get started.</p>
                        ) : (
                            <div className="table-container">
                                <table className="table">
                                    <thead><tr><th>Loan #</th><th>Amount</th><th>Interest</th><th>Balance</th><th>Due Date</th><th>Status</th></tr></thead>
                                    <tbody>
                                        {loans.map(l => {
                                            const isOverdue = l.status === 'active' && new Date(l.due_date) < new Date();
                                            return (
                                                <tr key={l.loan_id}>
                                                    <td>#{l.loan_id}</td>
                                                    <td>{fmtCurrency(l.loan_amount)}</td>
                                                    <td>{l.interest_rate}%</td>
                                                    <td><strong style={{color:isOverdue?'#c5221f':'inherit'}}>{fmtCurrency(l.balance)}</strong></td>
                                                    <td style={{fontSize:'0.85rem'}}>
                                                        {fmtDate(l.due_date)}
                                                        {isOverdue && <span className="badge badge-danger" style={{marginLeft:'6px',fontSize:'0.68rem'}}>OVERDUE</span>}
                                                    </td>
                                                    <td><span className={`badge ${l.status==='active'?'badge-info':'badge-success'}`}>{l.status}</span></td>
                                                </tr>
                                            );
                                        })}
                                    </tbody>
                                </table>
                            </div>
                        )}
                    </div>
                )}

                {/* ── PAYMENTS ── */}
                {tab === 'payments' && (
                    <div className="card">
                        <div className="card-header">💳 Payment History</div>
                        {payments.length === 0 ? <p className="text-muted">No payments recorded yet.</p> : (
                            <div className="table-container">
                                <table className="table">
                                    <thead><tr><th>Receipt</th><th>Amount</th><th>Date</th></tr></thead>
                                    <tbody>
                                        {payments.map(p => (
                                            <tr key={p.payment_id}>
                                                <td style={{fontSize:'0.82rem'}}>{p.receipt_number}</td>
                                                <td><strong>{fmtCurrency(p.amount)}</strong></td>
                                                <td style={{fontSize:'0.85rem'}}>{fmtDatetime(p.payment_date)}</td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        )}
                    </div>
                )}
            </div>
        </div>
    );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
