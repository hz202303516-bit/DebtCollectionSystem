<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPS Debt Collection System</title>
    <style>
        :root {
            --primary: #1a73e8;
            --primary-dark: #1557b0;
            --success: #0d904f;
            --danger: #d93025;
            --warning: #e6a817;
            --bg: #f0f2f5;
            --card: #ffffff;
            --text: #1f1f1f;
            --text-secondary: #5f6368;
            --border: #dadce0;
            --shadow: 0 1px 3px rgba(0,0,0,0.12), 0 1px 2px rgba(0,0,0,0.08);
            --shadow-lg: 0 10px 25px rgba(0,0,0,0.15);
            --radius: 12px;
            --transition: all 0.25s ease;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: var(--text);
        }

        /* Background pattern */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.05'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        /* Navbar */
        .navbar {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            border-radius: var(--radius);
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            box-shadow: var(--shadow-lg);
        }
        .navbar-brand {
            font-size: 1.4rem;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .navbar-actions { display: flex; gap: 10px; align-items: center; }
        .navbar-user { color: var(--text-secondary); font-size: 0.9rem; }

        /* Cards */
        .card {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            border-radius: var(--radius);
            padding: 30px;
            box-shadow: var(--shadow-lg);
            margin-bottom: 20px;
        }
        .card-header {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 20px;
            color: var(--text);
        }

        /* Grid */
        .grid { display: grid; gap: 20px; }
        .grid-2 { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
        .grid-3 { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
        .grid-4 { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }

        /* Stat Card */
        .stat-card {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border-radius: var(--radius);
            padding: 25px;
            text-align: center;
        }
        .stat-card.green { background: linear-gradient(135deg, #11998e, #38ef7d); }
        .stat-card.orange { background: linear-gradient(135deg, #f2994a, #f2c94c); }
        .stat-card.red { background: linear-gradient(135deg, #eb3349, #f45c43); }
        .stat-value { font-size: 2.2rem; font-weight: 700; }
        .stat-label { font-size: 0.9rem; opacity: 0.9; margin-top: 5px; }

        /* Buttons */
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn:hover { transform: translateY(-1px); box-shadow: var(--shadow); }
        .btn:active { transform: translateY(0); }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-dark); }
        .btn-success { background: var(--success); color: white; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-warning { background: var(--warning); color: #1f1f1f; }
        .btn-outline { background: transparent; border: 2px solid var(--border); color: var(--text); }
        .btn-sm { padding: 6px 14px; font-size: 0.8rem; }
        .btn-lg { padding: 14px 28px; font-size: 1rem; }
        .btn-block { width: 100%; justify-content: center; }

        /* Forms */
        .form-group { margin-bottom: 16px; }
        .form-label { display: block; font-weight: 500; margin-bottom: 6px; color: var(--text); font-size: 0.9rem; }
        .form-input, .form-select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 0.95rem;
            transition: var(--transition);
            background: white;
        }
        .form-input:focus, .form-select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(26,115,232,0.1);
        }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

        /* Tables */
        .table-container { overflow-x: auto; border-radius: var(--radius); }
        .table { width: 100%; border-collapse: collapse; }
        .table th {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 14px 16px;
            text-align: left;
            font-weight: 500;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .table td { padding: 12px 16px; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
        .table tr:hover td { background: rgba(102,126,234,0.05); }

        /* Badges */
        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        .badge-success { background: #e6f4ea; color: #137333; }
        .badge-warning { background: #fef7e0; color: #b06000; }
        .badge-danger { background: #fce8e6; color: #c5221f; }
        .badge-info { background: #e8f0fe; color: #1967d2; }
        .badge-purple { background: #f3e8fd; color: #7b1fa2; }

        /* Alerts */
        .alert {
            padding: 14px 18px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .alert-error { background: #fce8e6; color: #c5221f; border-left: 4px solid #c5221f; }
        .alert-success { background: #e6f4ea; color: #137333; border-left: 4px solid #137333; }
        .alert-info { background: #e8f0fe; color: #1967d2; border-left: 4px solid #1967d2; }

        /* Tabs */
        .tabs { display: flex; gap: 5px; margin-bottom: 20px; flex-wrap: wrap; }
        .tab {
            padding: 10px 20px;
            border: none;
            background: transparent;
            cursor: pointer;
            border-radius: 8px;
            font-size: 0.9rem;
            transition: var(--transition);
            color: var(--text-secondary);
        }
        .tab:hover { background: rgba(102,126,234,0.08); }
        .tab.active { background: var(--primary); color: white; }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6);
            z-index: 1000;
            justify-content: center;
            align-items: flex-start;
            padding: 40px 20px;
            overflow-y: auto;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: white;
            border-radius: var(--radius);
            padding: 30px;
            width: 100%;
            max-width: 600px;
            box-shadow: var(--shadow-lg);
            animation: slideUp 0.3s ease;
        }
        @keyframes slideUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .modal-close {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-secondary);
            padding: 5px;
        }

        /* Map placeholder */
        .map-placeholder {
            background: linear-gradient(135deg, #e8f0fe, #f3e8fd);
            border-radius: var(--radius);
            padding: 20px;
            text-align: center;
            min-height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            color: var(--text-secondary);
            border: 2px dashed var(--border);
        }

        /* Loading */
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 30px auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Page centering for auth */
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .auth-card {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            border-radius: var(--radius);
            padding: 40px;
            width: 100%;
            max-width: 520px;
            box-shadow: var(--shadow-lg);
        }

        .text-center { text-align: center; }
        .text-muted { color: var(--text-secondary); }
        .mt-1 { margin-top: 8px; }
        .mt-2 { margin-top: 16px; }
        .mt-3 { margin-top: 24px; }
        .mb-2 { margin-bottom: 16px; }
        .gap-2 { gap: 12px; }
        .flex { display: flex; }
        .flex-between { justify-content: space-between; }

        .risk-low { color: #137333; font-weight: 700; }
        .risk-medium { color: #b06000; font-weight: 700; }
        .risk-high { color: #c5221f; font-weight: 700; }

        /* Responsive */
        @media (max-width: 768px) {
            .form-row { grid-template-columns: 1fr; }
            .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
            .navbar { flex-direction: column; gap: 10px; text-align: center; }
            .auth-card { padding: 25px; }
        }

        .gps-indicator {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
        }
        .gps-active { background: #e6f4ea; color: #137333; }
        .gps-inactive { background: #fce8e6; color: #c5221f; }
        .gps-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            display: inline-block;
        }
        .gps-dot.active { background: #137333; animation: pulse 1.5s infinite; }
        .gps-dot.inactive { background: #c5221f; }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>

    <script type="text/babel">
        const { useState, useEffect, useCallback, useRef } = React;
        const API = axios.create({ baseURL: window.location.origin });
        
        API.interceptors.request.use(c => {
            const t = localStorage.getItem('token');
            if (t) c.headers.Authorization = `Bearer ${t}`;
            return c;
        });
        
        API.interceptors.response.use(r => r, e => {
            if (e.response?.status === 401) { localStorage.clear(); window.location.reload(); }
            return Promise.reject(e);
        });

        // ==================== ERROR BOUNDARY ====================
        class ErrorBoundary extends React.Component {
            state = { hasError: false, error: null };
            static getDerivedStateFromError(e) { return { hasError: true, error: e }; }
            render() {
                if (this.state.hasError) return (
                    <div className="auth-container">
                        <div className="auth-card text-center">
                            <h2>⚠️ Something went wrong</h2>
                            <p className="text-muted mt-2">{this.state.error?.message}</p>
                            <button className="btn btn-primary mt-3" onClick={() => window.location.reload()}>Reload</button>
                        </div>
                    </div>
                );
                return this.props.children;
            }
        }

        // ==================== MAIN APP ====================
        function App() {
            const [page, setPage] = useState('login');
            const [user, setUser] = useState(null);
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                const t = localStorage.getItem('token');
                const u = localStorage.getItem('user');
                if (t && u) { try { setUser(JSON.parse(u)); setPage('dashboard'); } catch(e) { localStorage.clear(); } }
                setLoading(false);
            }, []);

            const login = (u, t) => {
                localStorage.setItem('token', t);
                localStorage.setItem('user', JSON.stringify(u));
                setUser(u);
                setPage('dashboard');
            };

            const logout = () => { localStorage.clear(); setUser(null); setPage('login'); };

            if (loading) return <div className="auth-container"><div className="spinner"></div></div>;

            return (
                <ErrorBoundary>
                    {page === 'login' && <LoginPage onLogin={login} onRegister={() => setPage('register')} />}
                    {page === 'register' && <RegisterPage onSuccess={() => setPage('login')} onLogin={() => setPage('login')} />}
                    {page === 'dashboard' && user && <Dashboard user={user} onLogout={logout} setPage={setPage} />}
                    {page === 'admin' && user?.role === 'admin' && <AdminPanel user={user} onLogout={logout} setPage={setPage} />}
                    {page === 'collector' && user?.role === 'collector' && <CollectorPanel user={user} onLogout={logout} setPage={setPage} />}
                    {page === 'borrower' && user?.role === 'borrower' && <BorrowerPanel user={user} onLogout={logout} setPage={setPage} />}
                </ErrorBoundary>
            );
        }

        // ==================== LOGIN PAGE ====================
        function LoginPage({ onLogin, onRegister }) {
            const [form, setForm] = useState({ email: '', password: '' });
            const [error, setError] = useState('');
            const [loading, setLoading] = useState(false);

            const submit = async (e) => {
                e.preventDefault();
                setLoading(true);
                setError('');
                try {
                    const res = await API.post('/api/auth/login', form);
                    onLogin(res.data.user, res.data.token);
                } catch (err) { setError(err.response?.data?.error || 'Login failed'); }
                finally { setLoading(false); }
            };

            return (
                <div className="auth-container">
                    <div className="auth-card">
                        <div className="text-center mb-2">
                            <div style={{ fontSize: '3rem', marginBottom: '10px' }}>📍</div>
                            <h1 style={{ background: 'linear-gradient(135deg, #667eea, #764ba2)', WebkitBackgroundClip: 'text', WebkitTextFillColor: 'transparent', fontSize: '1.8rem' }}>
                                GPS Debt Collection System
                            </h1>
                            <p className="text-muted">Sign in to your account</p>
                        </div>
                        {error && <div className="alert alert-error">❌ {error}</div>}
                        <form onSubmit={submit}>
                            <div className="form-group">
                                <label className="form-label">Email</label>
                                <input className="form-input" type="email" placeholder="Enter your email" required
                                    value={form.email} onChange={e => setForm({...form, email: e.target.value})} />
                            </div>
                            <div className="form-group">
                                <label className="form-label">Password</label>
                                <input className="form-input" type="password" placeholder="Enter your password" required
                                    value={form.password} onChange={e => setForm({...form, password: e.target.value})} />
                            </div>
                            <button className="btn btn-primary btn-block btn-lg" type="submit" disabled={loading}>
                                {loading ? 'Signing in...' : '🔐 Sign In'}
                            </button>
                        </form>
                        <p className="text-center mt-3">
                            Don't have an account?{' '}
                            <a href="#" onClick={e => { e.preventDefault(); onRegister(); }} style={{ color: 'var(--primary)', fontWeight: 600 }}>Register</a>
                        </p>
                        <p className="text-center text-muted" style={{ fontSize: '0.8rem', marginTop: '10px' }}>
                            Demo: admin@system.com / admin123
                        </p>
                    </div>
                </div>
            );
        }

        // ==================== REGISTER PAGE (FIXED) ====================
        function RegisterPage({ onSuccess, onLogin }) {
            const [form, setForm] = useState({
                name: '', email: '', password: '', confirmPassword: '',
                phone: '', street: '', barangay: '', city: '', province: '', zip_code: '',
                latitude: null, longitude: null
            });
            const [error, setError] = useState('');
            const [success, setSuccess] = useState('');
            const [loading, setLoading] = useState(false);
            const [gettingLocation, setGettingLocation] = useState(false);

            const getLocation = () => {
                if (!navigator.geolocation) {
                    setError('Geolocation not supported by your browser');
                    return;
                }
                setGettingLocation(true);
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        setForm({...form, latitude: pos.coords.latitude, longitude: pos.coords.longitude});
                        setGettingLocation(false);
                        setError('');
                    },
                    (err) => {
                        setError('Failed to get location: ' + err.message);
                        setGettingLocation(false);
                    },
                    { enableHighAccuracy: true, timeout: 10000 }
                );
            };

            const submit = async (e) => {
                e.preventDefault();
                setError('');
                setSuccess('');

                if (!form.name || !form.email || !form.password) {
                    return setError('Name, email, and password are required');
                }
                if (form.password.length < 6) {
                    return setError('Password must be at least 6 characters');
                }
                if (form.password !== form.confirmPassword) {
                    return setError('Passwords do not match');
                }
                if (!form.street || !form.barangay || !form.city) {
                    return setError('Please provide your complete address (street, barangay, and city are required)');
                }

                setLoading(true);
                try {
                    const res = await API.post('/api/auth/register', {
                        name: form.name,
                        email: form.email,
                        password: form.password,
                        phone: form.phone,
                        street: form.street,
                        barangay: form.barangay,
                        city: form.city,
                        province: form.province,
                        zip_code: form.zip_code,
                        latitude: form.latitude,
                        longitude: form.longitude
                    });
                    setSuccess(res.data.message || 'Registration successful!');
                    setTimeout(() => onSuccess(), 2000);
                } catch (err) {
                    setError(err.response?.data?.error || 'Registration failed. Please try again.');
                } finally {
                    setLoading(false);
                }
            };

            const update = (field, value) => setForm({...form, [field]: value});

            return (
                <div className="auth-container">
                    <div className="auth-card" style={{ maxWidth: '600px' }}>
                        <div className="text-center mb-2">
                            <h2 style={{ background: 'linear-gradient(135deg, #667eea, #764ba2)', WebkitBackgroundClip: 'text', WebkitTextFillColor: 'transparent' }}>
                                Create Account
                            </h2>
                            <p className="text-muted">Register for the GPS Debt Collection System</p>
                        </div>
                        {error && <div className="alert alert-error">❌ {error}</div>}
                        {success && <div className="alert alert-success">✅ {success}</div>}
                        <form onSubmit={submit}>
                            <div className="form-group">
                                <label className="form-label">Full Name *</label>
                                <input className="form-input" type="text" placeholder="Juan Dela Cruz" required
                                    value={form.name} onChange={e => update('name', e.target.value)} />
                            </div>
                            <div className="form-row">
                                <div className="form-group">
                                    <label className="form-label">Email *</label>
                                    <input className="form-input" type="email" placeholder="juan@email.com" required
                                        value={form.email} onChange={e => update('email', e.target.value)} />
                                </div>
                                <div className="form-group">
                                    <label className="form-label">Phone</label>
                                    <input className="form-input" type="tel" placeholder="09123456789"
                                        value={form.phone} onChange={e => update('phone', e.target.value)} />
                                </div>
                            </div>
                            <div className="form-row">
                                <div className="form-group">
                                    <label className="form-label">Password * (min 6 chars)</label>
                                    <input className="form-input" type="password" placeholder="••••••" required
                                        value={form.password} onChange={e => update('password', e.target.value)} />
                                </div>
                                <div className="form-group">
                                    <label className="form-label">Confirm Password *</label>
                                    <input className="form-input" type="password" placeholder="••••••" required
                                        value={form.confirmPassword} onChange={e => update('confirmPassword', e.target.value)} />
                                </div>
                            </div>

                            <div className="card" style={{ background: '#f8f9fa', boxShadow: 'none', marginBottom: '16px' }}>
                                <h4 style={{ marginBottom: '12px' }}>📍 Address Information</h4>
                                <div className="form-group">
                                    <label className="form-label">Street / House No. *</label>
                                    <input className="form-input" type="text" placeholder="123 Rizal Street" required
                                        value={form.street} onChange={e => update('street', e.target.value)} />
                                </div>
                                <div className="form-row">
                                    <div className="form-group">
                                        <label className="form-label">Barangay *</label>
                                        <input className="form-input" type="text" placeholder="Barangay" required
                                            value={form.barangay} onChange={e => update('barangay', e.target.value)} />
                                    </div>
                                    <div className="form-group">
                                        <label className="form-label">City / Municipality *</label>
                                        <input className="form-input" type="text" placeholder="City" required
                                            value={form.city} onChange={e => update('city', e.target.value)} />
                                    </div>
                                </div>
                                <div className="form-row">
                                    <div className="form-group">
                                        <label className="form-label">Province</label>
                                        <input className="form-input" type="text" placeholder="Province"
                                            value={form.province} onChange={e => update('province', e.target.value)} />
                                    </div>
                                    <div className="form-group">
                                        <label className="form-label">Zip Code</label>
                                        <input className="form-input" type="text" placeholder="Zip Code"
                                            value={form.zip_code} onChange={e => update('zip_code', e.target.value)} />
                                    </div>
                                </div>
                            </div>

        // ==================== ADMIN PANEL ====================
        function AdminPanel({ user, onLogout, setPage }) {
            const [tab, setTab] = useState('users');

            const [borrowers, setBorrowers] = useState([]);
            const [loans, setLoans] = useState([]);
            const [payments, setPayments] = useState([]);
            const [collectors, setCollectors] = useState([]);
            const [assignments, setAssignments] = useState([]);
            const [gpsBorrowers, setGpsBorrowers] = useState([]);
            const [showLoanModal, setShowLoanModal] = useState(false);
            const [showAssignModal, setShowAssignModal] = useState(false);
            const [selectedBorrower, setSelectedBorrower] = useState(null);
            const [riskData, setRiskData] = useState(null);
            const [newLoan, setNewLoan] = useState({ borrower_id: '', loan_amount: '', interest_rate: '', due_date: '' });
            const [assignForm, setAssignForm] = useState({ collector_id: '', borrower_id: '' });
            const [msg, setMsg] = useState({});

            useEffect(() => { loadData(); }, []);

            const loadData = async () => {
                try {
                    const [u, b, l, p, c, a, g] = await Promise.all([
                        API.get('/api/users'), API.get('/api/borrowers'), API.get('/api/loans'),
                        API.get('/api/payments'), API.get('/api/collectors'), API.get('/api/assignments'),
                        API.get('/api/gps/borrowers')
                    ]);
                    setUsers(u.data); setBorrowers(b.data); setLoans(l.data);
                    setPayments(p.data); setCollectors(c.data); setAssignments(a.data);
                    setGpsBorrowers(g.data);
                } catch (e) { setMsg({ error: 'Failed to load data' }); }
            };

            const approveUser = async (id) => {
                try { await API.put(`/api/users/${id}/status`, { status: 'approved' }); setMsg({ success: 'User approved!' }); loadData(); }
                catch (e) { setMsg({ error: e.response?.data?.error || 'Failed' }); }
            };

            const createLoan = async (e) => {
                e.preventDefault();
                try { await API.post('/api/loans', newLoan); setMsg({ success: 'Loan created!' }); setShowLoanModal(false); setNewLoan({ borrower_id: '', loan_amount: '', interest_rate: '', due_date: '' }); loadData(); }
                catch (e) { setMsg({ error: e.response?.data?.error || 'Failed' }); }
            };

            const assignCollector = async (e) => {
                e.preventDefault();
                try { await API.post('/api/assignments', assignForm); setMsg({ success: 'Collector assigned!' }); setShowAssignModal(false); loadData(); }
                catch (e) { setMsg({ error: e.response?.data?.error || 'Failed' }); }
            };

            const assessRisk = async (id) => {
                try { const r = await API.get(`/api/ml/risk/${id}`); setRiskData(r.data); }

                            <button className="btn btn-danger btn-sm" onClick={onLogout}>🚪 Logout</button>

                    </nav>
                    <div className="container">
                        {msg.error && <div className="alert alert-error">{msg.error}</div>}
                        {msg.success && <div className="alert alert-success">{msg.success}</div>}

                        <div className="tabs">
                            {tabs.map(t => (
                                <button key={t} className={`tab ${tab === t ? 'active' : ''}`} onClick={() => setTab(t)}>

                        </div>

                        {tab === 'users' && (
                            <div className="card">
                                <div className="table-container">
                                    <table className="table">
                                        <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Address</th><th>GPS</th><th>Action</th></tr></thead>
                                        <tbody>
                                            {users.map(u => (
                                                <tr key={u.user_id}>
                                                    <td>{u.name}</td><td>{u.email}</td>
                                                    <td><span className="badge badge-info">{u.role}</span></td>
                                                    <td><span className={`badge ${u.status === 'approved' ? 'badge-success' : u.status === 'pending' ? 'badge-warning' : 'badge-danger'}`}>{u.status}</span></td>
                                                    <td style={{fontSize:'0.8rem'}}>{[u.street, u.barangay, u.city].filter(Boolean).join(', ') || 'N/A'}</td>
                                                    <td>{u.latitude ? <span className="gps-indicator gps-active"><span className="gps-dot active"></span> Yes</span> : <span className="gps-indicator gps-inactive"><span className="gps-dot inactive"></span> No</span>}</td>

                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}

                        {tab === 'borrowers' && (
                            <div className="card">
                                <div className="flex flex-between mb-2">
                                    <button className="btn btn-primary btn-sm" onClick={() => setShowLoanModal(true)}>💰 Create Loan</button>
                                    <button className="btn btn-warning btn-sm" onClick={() => { setAssignForm({...assignForm, borrower_id: ''}); setShowAssignModal(true); }}>👤 Assign Collector</button>
                                </div>
                                <div className="table-container">
                                    <table className="table">
                                        <thead><tr><th>Name</th><th>Address</th><th>GPS</th><th>Collector</th><th>Risk</th></tr></thead>
                                        <tbody>
                                            {borrowers.map(b => (
                                                <tr key={b.borrower_id}>
                                                    <td>{b.full_name}</td>
                                                    <td style={{fontSize:'0.8rem'}}>{[b.street, b.barangay, b.city].filter(Boolean).join(', ') || 'N/A'}</td>
                                                    <td>{b.latitude ? <span className="gps-indicator gps-active"><span className="gps-dot active"></span> Tracked</span> : 'N/A'}</td>
                                                    <td>{b.collector_name || <span className="text-muted">Unassigned</span>}</td>
                                                    <td><button className="btn btn-outline btn-sm" onClick={() => assessRisk(b.borrower_id)}>Assess</button></td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}

                        {tab === 'loans' && (
                            <div className="card">
                                <div className="table-container">
                                    <table className="table">
                                        <thead><tr><th>ID</th><th>Borrower</th><th>Amount</th><th>Interest</th><th>Balance</th><th>Due Date</th><th>Status</th></tr></thead>
                                        <tbody>
                                            {loans.map(l => (
                                                <tr key={l.loan_id}>
                                                    <td>{l.loan_id}</td><td>{l.borrower_name}</td>
                                                    <td>₱{parseFloat(l.loan_amount).toLocaleString()}</td>
                                                    <td>{l.interest_rate}%</td>
                                                    <td>₱{parseFloat(l.balance).toLocaleString()}</td>
                                                    <td>{new Date(l.due_date).toLocaleDateString()}</td>
                                                    <td><span className={`badge ${l.status === 'active' ? 'badge-info' : l.status === 'paid' ? 'badge-success' : 'badge-danger'}`}>{l.status}</span></td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}

                        {tab === 'payments' && (
                            <div className="card">
                                <div className="table-container">
                                    <table className="table">
                                        <thead><tr><th>Receipt</th><th>Borrower</th><th>Collector</th><th>Amount</th><th>GPS</th><th>Date</th></tr></thead>
                                        <tbody>
                                            {payments.map(p => (
                                                <tr key={p.payment_id}>
                                                    <td style={{fontSize:'0.8rem'}}>{p.receipt_number}</td>
                                                    <td>{p.borrower_name}</td><td>{p.collector_name || 'N/A'}</td>
                                                    <td>₱{p.amount}</td>
                                                    <td>{p.latitude ? '📍' : '-'}</td>
                                                    <td>{new Date(p.payment_date).toLocaleString()}</td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}

                        {tab === 'assignments' && (
                            <div className="card">
                                <div className="table-container">
                                    <table className="table">
                                        <thead><tr><th>Borrower</th><th>Collector</th><th>Status</th><th>Date</th></tr></thead>
                                        <tbody>
                                            {assignments.map(a => (
                                                <tr key={a.assignment_id}>
                                                    <td>{a.borrower_name}</td><td>{a.collector_name}</td>
                                                    <td><span className="badge badge-info">{a.status}</span></td>
                                                    <td>{new Date(a.assigned_date).toLocaleDateString()}</td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}

                        {tab === 'gps' && (
                            <div className="card">
                                <h4>📍 Borrower Locations</h4>
                                <div className="grid grid-2 mt-2">
                                    {gpsBorrowers.map(b => (
                                        <div key={b.borrower_id} className="card" style={{ background: '#f8f9fa' }}>
                                            <strong>{b.full_name}</strong>
                                            <p className="text-muted" style={{fontSize:'0.85rem'}}>{b.street}, {b.barangay}, {b.city}</p>
                                            <p style={{fontSize:'0.85rem'}}>📍 {b.latitude?.toFixed(6)}, {b.longitude?.toFixed(6)}</p>
                                            <a href={`https://www.google.com/maps?q=${b.latitude},${b.longitude}`} target="_blank" className="btn btn-outline btn-sm mt-1">🗺️ View on Map</a>
                                        </div>
                                    ))}
                                    {gpsBorrowers.length === 0 && <p className="text-muted">No borrower locations available</p>}
                                </div>
                            </div>
                        )}

                        {tab === 'risk' && (
                            <div className="card">
                                <h4>📊 Risk Assessment</h4>
                                {riskData ? (
                                    <div className="mt-2">
                                        <p><strong>Borrower:</strong> {riskData.borrower}</p>
                                        <p><strong>Risk Score:</strong> <span className={`risk-${riskData.risk_level?.toLowerCase()}`}>{riskData.risk_score} - {riskData.risk_level}</span></p>
                                        <p><strong>Total Loans:</strong> {riskData.total_loans}</p>
                                        <p><strong>Active Loans:</strong> {riskData.active_loans}</p>
                                        <div style={{
                                            background: '#f0f0f0', borderRadius: '10px', height: '20px', marginTop: '10px',
                                            overflow: 'hidden'
                                        }}>
                                            <div style={{
                                                width: `${riskData.risk_score}%`,
                                                height: '100%',
                                                background: riskData.risk_score >= 70 ? '#137333' : riskData.risk_score >= 40 ? '#e6a817' : '#c5221f',
                                                borderRadius: '10px',
                                                transition: 'width 0.5s ease'
                                            }}></div>
                                        </div>
                                    </div>
                                ) : (
                                    <p className="text-muted">Click "Assess" on a borrower to see risk assessment</p>
                                )}
                            </div>
                        )}
                    </div>

                    {/* Create Loan Modal */}
                    <div className={`modal-overlay ${showLoanModal ? 'active' : ''}`} onClick={e => { if (e.target === e.currentTarget) setShowLoanModal(false); }}>

                                <div className="form-group">
                                    <label className="form-label">Borrower</label>
                                    <select className="form-select" value={newLoan.borrower_id} onChange={e => setNewLoan({...newLoan, borrower_id: e.target.value})} required>

                                </div>

                                    <div className="form-group"><label className="form-label">Amount (₱)</label><input className="form-input" type="number" required value={newLoan.loan_amount} onChange={e => setNewLoan({...newLoan, loan_amount: e.target.value})} /></div>
                                    <div className="form-group"><label className="form-label">Interest Rate (%)</label><input className="form-input" type="number" required value={newLoan.interest_rate} onChange={e => setNewLoan({...newLoan, interest_rate: e.target.value})} /></div>
                                </div>
                                <div className="form-group"><label className="form-label">Due Date</label><input className="form-input" type="date" required value={newLoan.due_date} onChange={e => setNewLoan({...newLoan, due_date: e.target.value})} /></div>

                            </form>
                        </div>
                    </div>
                </div>
            );
        }

        // ==================== COLLECTOR PANEL ====================
        function CollectorPanel({ user, onLogout, setPage }) {
            const [borrowers, setBorrowers] = useState([]);
            const [loans, setLoans] = useState([]);
            const [payAmount, setPayAmount] = useState({});
            const [gps, setGps] = useState({});

            useEffect(() => { loadData(); }, []);

            const loadData = async () => {
                try {
                    const [b, l] = await Promise.all([API.get('/api/borrowers'), API.get('/api/loans')]);
                    setBorrowers(b.data); setLoans(l.data);
                } catch (e) { console.error(e); }
            };

            const recordPayment = async (loanId) => {
                const amount = payAmount[loanId];
                if (!amount) return alert('Enter amount');
                try {
                    await API.post('/api/payments', {
                        loan_id: loanId,
                        amount: parseFloat(amount),
                        latitude: gps.latitude,
                        longitude: gps.longitude
                    });
                    alert('Payment recorded!');
                    setPayAmount({...payAmount, [loanId]: ''});
                    loadData();
                } catch (e) { alert(e.response?.data?.error || 'Failed'); }
            };

            const getGps = () => {
                navigator.geolocation.getCurrentPosition(
                    pos => setGps({ latitude: pos.coords.latitude, longitude: pos.coords.longitude }),
                    err => alert('GPS error: ' + err.message),
                    { enableHighAccuracy: true }
                );
            };

            return (
                <div>
                    <nav className="navbar">
                        <span className="navbar-brand">📍 Collector Panel</span>
                        <div className="navbar-actions">
                            <span className={`gps-indicator ${gps.latitude ? 'gps-active' : 'gps-inactive'}`}>
                                <span className={`gps-dot ${gps.latitude ? 'active' : 'inactive'}`}></span>
                                {gps.latitude ? 'GPS Active' : 'GPS Inactive'}
                            </span>
                            <button className="btn btn-outline btn-sm" onClick={getGps}>📍 Get GPS</button>
                            <button className="btn btn-outline btn-sm" onClick={() => setPage('dashboard')}>📊 Dashboard</button>
                            <button className="btn btn-danger btn-sm" onClick={onLogout}>🚪 Logout</button>
                        </div>
                    </nav>
                    <div className="container">
                        <div className="card">
                            <h3>My Borrowers</h3>
                            <div className="table-container mt-2">
                                <table className="table">
                                    <thead><tr><th>Name</th><th>Address</th><th>GPS</th><th>Map</th></tr></thead>
                                    <tbody>
                                        {borrowers.map(b => (
                                            <tr key={b.borrower_id}>
                                                <td>{b.full_name}</td>
                                                <td>{[b.street, b.barangay, b.city].filter(Boolean).join(', ')}</td>
                                                <td>{b.latitude ? '📍' : '-'}</td>
                                                <td>{b.latitude && <a href={`https://www.google.com/maps?q=${b.latitude},${b.longitude}`} target="_blank" className="btn btn-outline btn-sm">🗺️ Map</a>}</td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                        <div className="card mt-3">
                            <h3>Active Loans</h3>
                            <div className="table-container mt-2">
                                <table className="table">
                                    <thead><tr><th>Borrower</th><th>Amount</th><th>Balance</th><th>Due Date</th><th>Payment</th></tr></thead>
                                    <tbody>
                                        {loans.filter(l => l.status === 'active').map(l => (
                                            <tr key={l.loan_id}>
                                                <td>{l.borrower_name}</td>
                                                <td>₱{parseFloat(l.loan_amount).toLocaleString()}</td>
                                                <td>₱{parseFloat(l.balance).toLocaleString()}</td>
                                                <td>{new Date(l.due_date).toLocaleDateString()}</td>
                                                <td>
                                                    <div style={{display:'flex', gap:'8px'}}>
                                                        <input type="number" className="form-input" style={{width:'100px', padding:'8px'}} placeholder="Amount"
                                                            value={payAmount[l.loan_id] || ''} onChange={e => setPayAmount({...payAmount, [l.loan_id]: e.target.value})} />
                                                        <button className="btn btn-success btn-sm" onClick={() => recordPayment(l.loan_id)}>Pay</button>
                                                    </div>
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // ==================== BORROWER PANEL ====================
        function BorrowerPanel({ user, onLogout, setPage }) {

            const [payments, setPayments] = useState([]);

                try {
                    const [l, p] = await Promise.all([API.get('/api/loans'), API.get('/api/payments')]);
                    setLoans(l.data); setPayments(p.data);
                } catch (e) { console.error(e); }
            };

            return (
                <div>
                    <nav className="navbar">
                        <span className="navbar-brand">📍 My Loans</span>
                        <div className="navbar-actions">
                            <button className="btn btn-outline btn-sm" onClick={() => setPage('dashboard')}>📊 Dashboard</button>
                            <button className="btn btn-danger btn-sm" onClick={onLogout}>🚪 Logout</button>
                        </div>
                    </nav>
                    <div className="container">
                        <div className="card">
                            <h3>My Loans</h3>
                            <div className="table-container mt-2">
                                <table className="table">
                                    <thead><tr><th>ID</th><th>Amount</th><th>Interest</th><th>Balance</th><th>Due Date</th><th>Status</th></tr></thead>
                                    <tbody>
                                        {loans.map(l => (
                                            <tr key={l.loan_id}>
                                                <td>{l.loan_id}</td>
                                                <td>₱{parseFloat(l.loan_amount).toLocaleString()}</td>
                                                <td>{l.interest_rate}%</td>
                                                <td>₱{parseFloat(l.balance).toLocaleString()}</td>
                                                <td>{new Date(l.due_date).toLocaleDateString()}</td>
                                                <td><span className={`badge ${l.status === 'active' ? 'badge-info' : 'badge-success'}`}>{l.status}</span></td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                        <div className="card mt-3">
                            <h3>Payment History</h3>
                            <div className="table-container mt-2">
                                <table className="table">
                                    <thead><tr><th>Receipt</th><th>Amount</th><th>Date</th></tr></thead>
                                    <tbody>
                                        {payments.map(p => (
                                            <tr key={p.payment_id}>
                                                <td>{p.receipt_number}</td>
                                                <td>₱{p.amount}</td>
                                                <td>{new Date(p.payment_date).toLocaleString()}</td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // ==================== RENDER ====================
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
        // ==================== AUTO-DISMISS ALERTS ====================
    // This watches for alert messages and auto-dismisses them after 3 seconds
    const alertObserver = new MutationObserver(() => {
        const alerts = document.querySelectorAll('.alert');
        alerts.forEach(alert => {
            // Only auto-dismiss if not already being dismissed
            if (!alert.dataset.dismissing) {
                alert.dataset.dismissing = 'true';
                setTimeout(() => {
                    alert.style.transition = 'opacity 0.5s ease, transform 0.5s ease';
                    alert.style.opacity = '0';
                    alert.style.transform = 'translateY(-10px)';
                    setTimeout(() => {
                        if (alert.parentNode) {
                            alert.remove();
                        }
                    }, 500);
                }, 3000); // Disappears after 3 seconds
            }
        });
    });
    
    // Start observing the document for alert elements
    alertObserver.observe(document.body, {
        childList: true,
        subtree: true
    });
    </script>
</body>
</html>
