<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPS Debt Collection System</title>
    <style>
        :root {
            --primary: #1a73e8;
            --primary-dark: #1557b0;
            --success: #0d904f;
            --danger: #d93025;
            --warning: #e6a817;
            --bg: #f0f2f5;
            --card: #ffffff;
            --text: #1f1f1f;
            --text-secondary: #5f6368;
            --border: #dadce0;
            --shadow: 0 1px 3px rgba(0,0,0,0.12), 0 1px 2px rgba(0,0,0,0.08);
            --shadow-lg: 0 10px 25px rgba(0,0,0,0.15);
            --radius: 12px;
            --transition: all 0.25s ease;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; color: var(--text); }
        body::before { content: ''; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.05'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E"); pointer-events: none; z-index: 0; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; position: relative; z-index: 1; }
        .navbar { background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); border-radius: var(--radius); padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; box-shadow: var(--shadow-lg); }
        .navbar-brand { font-size: 1.4rem; font-weight: 700; background: linear-gradient(135deg, #667eea, #764ba2); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .navbar-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .navbar-user { color: var(--text-secondary); font-size: 0.9rem; }
        .card { background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); border-radius: var(--radius); padding: 30px; box-shadow: var(--shadow-lg); margin-bottom: 20px; }
        .card-header { font-size: 1.3rem; font-weight: 600; margin-bottom: 20px; color: var(--text); }
        .grid { display: grid; gap: 20px; }
        .grid-2 { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
        .grid-3 { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
        .grid-4 { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
        .stat-card { background: linear-gradient(135deg, #667eea, #764ba2); color: white; border-radius: var(--radius); padding: 25px; text-align: center; }
        .stat-card.green { background: linear-gradient(135deg, #11998e, #38ef7d); }
        .stat-card.orange { background: linear-gradient(135deg, #f2994a, #f2c94c); }
        .stat-card.red { background: linear-gradient(135deg, #eb3349, #f45c43); }
        .stat-value { font-size: 2.2rem; font-weight: 700; }
        .stat-label { font-size: 0.9rem; opacity: 0.9; margin-top: 5px; }
        .btn { padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-size: 0.9rem; font-weight: 500; transition: var(--transition); display: inline-flex; align-items: center; gap: 6px; }
        .btn:hover { transform: translateY(-1px); box-shadow: var(--shadow); }
        .btn:active { transform: translateY(0); }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover:not(:disabled) { background: var(--primary-dark); }
        .btn-success { background: var(--success); color: white; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-warning { background: var(--warning); color: #1f1f1f; }
        .btn-outline { background: transparent; border: 2px solid var(--border); color: var(--text); }
        .btn-purple { background: #7b1fa2; color: white; }
        .btn-sm { padding: 6px 14px; font-size: 0.8rem; }
        .btn-lg { padding: 14px 28px; font-size: 1rem; }
        .btn-block { width: 100%; justify-content: center; }
        .form-group { margin-bottom: 16px; }
        .form-label { display: block; font-weight: 500; margin-bottom: 6px; color: var(--text); font-size: 0.9rem; }
        .form-label .required { color: var(--danger); margin-left: 2px; }
        .form-input, .form-select, .form-textarea { width: 100%; padding: 12px 16px; border: 2px solid var(--border); border-radius: 8px; font-size: 0.95rem; transition: var(--transition); background: white; font-family: inherit; }
        .form-textarea { min-height: 80px; resize: vertical; }
        .form-input:focus, .form-select:focus, .form-textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(26,115,232,0.1); }
        .form-input.error, .form-select.error { border-color: var(--danger); }
        .form-hint { font-size: 0.78rem; color: var(--text-secondary); margin-top: 4px; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .password-wrapper { position: relative; display: flex; align-items: center; }
        .password-wrapper .form-input { padding-right: 46px; }
        .password-toggle { position: absolute; right: 12px; background: none; border: none; cursor: pointer; font-size: 1.1rem; color: var(--text-secondary); padding: 4px; line-height: 1; transition: color 0.2s; user-select: none; }
        .password-toggle:hover { color: var(--primary); }
        .table-container { overflow-x: auto; border-radius: var(--radius); }
        .table { width: 100%; border-collapse: collapse; }
        .table th { background: linear-gradient(135deg, #667eea, #764ba2); color: white; padding: 14px 16px; text-align: left; font-weight: 500; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.5px; }
        .table td { padding: 12px 16px; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
        .table tr:hover td { background: rgba(102,126,234,0.05); }
        .badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.3px; }
        .badge-success { background: #e6f4ea; color: #137333; }
        .badge-warning { background: #fef7e0; color: #b06000; }
        .badge-danger { background: #fce8e6; color: #c5221f; }
        .badge-info { background: #e8f0fe; color: #1967d2; }
        .badge-purple { background: #f3e8fd; color: #7b1fa2; }
        .alert { padding: 14px 18px; border-radius: 8px; margin-bottom: 16px; font-size: 0.9rem; display: flex; align-items: flex-start; gap: 10px; transition: opacity 0.5s ease, transform 0.5s ease; }
        .alert-error { background: #fce8e6; color: #c5221f; border-left: 4px solid #c5221f; }
        .alert-success { background: #e6f4ea; color: #137333; border-left: 4px solid #137333; }
        .alert-info { background: #e8f0fe; color: #1967d2; border-left: 4px solid #1967d2; }
        .alert-warning { background: #fef7e0; color: #b06000; border-left: 4px solid #e6a817; }
        .alert.dismissing { opacity: 0; transform: translateY(-10px); }
        .tabs { display: flex; gap: 5px; margin-bottom: 20px; flex-wrap: wrap; }
        .tab { padding: 10px 20px; border: none; background: transparent; cursor: pointer; border-radius: 8px; font-size: 0.9rem; transition: var(--transition); color: var(--text-secondary); }
        .tab:hover { background: rgba(102,126,234,0.08); }
        .tab.active { background: var(--primary); color: white; }
        .tab-badge { background: var(--danger); color: white; font-size: 0.7rem; padding: 1px 6px; border-radius: 10px; margin-left: 4px; }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); z-index: 1000; justify-content: center; align-items: flex-start; padding: 40px 20px; overflow-y: auto; }
        .modal-overlay.active { display: flex; }
        .modal { background: white; border-radius: var(--radius); padding: 30px; width: 100%; max-width: 600px; box-shadow: var(--shadow-lg); animation: slideUp 0.3s ease; }
        @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .modal-close { background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--text-secondary); padding: 5px; }
        .spinner { width: 40px; height: 40px; border: 3px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 30px auto; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .auth-container { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .auth-card { background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); border-radius: var(--radius); padding: 40px; width: 100%; max-width: 520px; box-shadow: var(--shadow-lg); }
        .text-center { text-align: center; }
        .text-muted { color: var(--text-secondary); }
        .mt-1 { margin-top: 8px; }
        .mt-2 { margin-top: 16px; }
        .mt-3 { margin-top: 24px; }
        .mb-1 { margin-bottom: 8px; }
        .mb-2 { margin-bottom: 16px; }
        .flex { display: flex; }
        .flex-between { justify-content: space-between; align-items: center; }
        .flex-wrap { flex-wrap: wrap; }
        .gap-2 { gap: 12px; }
        .risk-low { color: #137333; font-weight: 700; }
        .risk-medium { color: #b06000; font-weight: 700; }
        .risk-high { color: #c5221f; font-weight: 700; }

        /* ── Application Status Cards ── */
        .app-status-card { border-radius: 10px; padding: 16px 18px; border: 2px solid; margin-bottom: 12px; }
        .app-status-card.pending { background: #fef7e0; border-color: #e6a817; }
        .app-status-card.approved { background: #e6f4ea; border-color: #0d904f; }
        .app-status-card.rejected { background: #fce8e6; border-color: #c5221f; }
        .app-status-title { font-weight: 700; font-size: 0.95rem; margin-bottom: 6px; }
        .app-status-meta { font-size: 0.82rem; color: var(--text-secondary); display: flex; gap: 16px; flex-wrap: wrap; }

        /* ── GPS styles ── */
        .gps-indicator { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 500; }
        .gps-active { background: #e6f4ea; color: #137333; }
        .gps-inactive { background: #fce8e6; color: #c5221f; }
        .gps-geocoded { background: #e8f0fe; color: #1967d2; }
        .gps-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
        .gps-dot.active { background: #137333; animation: pulse 1.5s infinite; }
        .gps-dot.inactive { background: #c5221f; }
        .gps-dot.geocoded { background: #1967d2; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        /* ── ML Dashboard ── */
        .ml-summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 14px; margin-bottom: 22px; }
        .ml-stat { background: white; border-radius: 10px; padding: 18px 14px; text-align: center; border: 1px solid var(--border); box-shadow: var(--shadow); }
        .ml-stat-val { font-size: 1.9rem; font-weight: 700; }
        .ml-stat-label { font-size: 0.78rem; color: var(--text-secondary); margin-top: 4px; text-transform: uppercase; letter-spacing: 0.4px; }
        .ml-stat.high .ml-stat-val { color: #c5221f; }
        .ml-stat.medium .ml-stat-val { color: #b06000; }
        .ml-stat.low .ml-stat-val { color: #137333; }
        .ml-stat.avg .ml-stat-val { color: #1a73e8; }
        .risk-bar-wrap { display: flex; align-items: center; gap: 8px; }
        .risk-bar-bg { flex: 1; height: 8px; background: #f0f0f0; border-radius: 99px; overflow: hidden; min-width: 60px; }
        .risk-bar-fill { height: 100%; border-radius: 99px; transition: width 0.4s ease; }
        .risk-score-num { font-size: 0.85rem; font-weight: 700; min-width: 28px; text-align: right; }
        .ml-detail-card { background: #f8f9fa; border-radius: 10px; padding: 18px; margin-top: 10px; }
        .ml-detail-header { font-size: 1.05rem; font-weight: 600; margin-bottom: 12px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .ml-factor-row { display: flex; justify-content: space-between; font-size: 0.85rem; padding: 5px 0; border-bottom: 1px solid #ebebeb; }
        .ml-factor-row:last-child { border-bottom: none; }
        .ml-factor-label { color: var(--text-secondary); }
        .ml-factor-val { font-weight: 600; }
        .ml-strategy-list { margin-top: 12px; display: flex; flex-direction: column; gap: 7px; }
        .ml-strategy-item { background: white; border-radius: 7px; padding: 9px 13px; font-size: 0.83rem; line-height: 1.5; border-left: 3px solid #ccc; }
        .ml-strategy-item.high { border-left-color: #c5221f; }
        .ml-strategy-item.medium { border-left-color: #e6a817; }
        .ml-strategy-item.low { border-left-color: #0d904f; }
        .ml-filter-row { display: flex; gap: 10px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
        .ml-filter-btn { padding: 7px 16px; border: 2px solid var(--border); border-radius: 20px; background: white; cursor: pointer; font-size: 0.83rem; font-weight: 500; transition: var(--transition); }
        .ml-filter-btn:hover { border-color: var(--primary); color: var(--primary); }
        .ml-filter-btn.active-filter { background: var(--primary); color: white; border-color: var(--primary); }
        .ml-filter-btn.high-filter.active-filter { background: #c5221f; border-color: #c5221f; }
        .ml-filter-btn.medium-filter.active-filter { background: #e6a817; border-color: #e6a817; color: #1f1f1f; }
        .ml-filter-btn.low-filter.active-filter { background: #0d904f; border-color: #0d904f; }
        .score-breakdown-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
        .score-chip { background: #f0f0f0; border-radius: 6px; padding: 6px 10px; font-size: 0.78rem; }
        .score-chip-label { color: var(--text-secondary); }
        .score-chip-val { font-weight: 600; float: right; }
        .ml-manual-form { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .ml-manual-form .form-group { margin-bottom: 0; }
        .ml-result-box { border-radius: 10px; padding: 20px; margin-top: 16px; border: 2px solid #ebebeb; }
        .ml-result-box.high { background: #fce8e6; border-color: #c5221f; }
        .ml-result-box.medium { background: #fef7e0; border-color: #e6a817; }
        .ml-result-box.low { background: #e6f4ea; border-color: #0d904f; }
        .ml-result-title { font-size: 1.3rem; font-weight: 700; }
        .ml-result-score { font-size: 2.5rem; font-weight: 800; }

        /* ── GPS fallback notice ── */
        .gps-fallback-box { background: #e8f0fe; border: 1.5px solid #1a73e8; border-radius: 10px; padding: 14px 18px; margin-top: 10px; font-size: 0.87rem; }
        .gps-fallback-box strong { display: block; color: #1967d2; margin-bottom: 4px; }

        @media (max-width: 768px) {
            .form-row { grid-template-columns: 1fr; }
            .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
            .navbar { flex-direction: column; gap: 10px; text-align: center; }
            .auth-card { padding: 25px; }
            .ml-manual-form { grid-template-columns: 1fr; }
            .score-breakdown-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/axios/dist/axios.min.js"></script>

<script type="text/babel">
const { useState, useEffect, useCallback, useRef } = React;
const API = axios.create({ baseURL: window.location.origin });

API.interceptors.request.use(c => {
    const t = localStorage.getItem('token');
    if (t) c.headers.Authorization = `Bearer ${t}`;
    return c;
});
API.interceptors.response.use(r => r, e => {
    if (e.response?.status === 401) { localStorage.clear(); window.location.reload(); }
    return Promise.reject(e);
});

// ── Helpers ──
function fmtCurrency(val) { return '₱' + parseFloat(val || 0).toLocaleString('en-PH', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function fmtDate(d) { if (!d) return '—'; return new Date(d).toLocaleDateString('en-PH', { year:'numeric', month:'short', day:'numeric' }); }
function fmtDatetime(d) { if (!d) return '—'; return new Date(d).toLocaleString('en-PH'); }

function PasswordInput({ value, onChange, placeholder = '••••••', required = false }) {
    const [show, setShow] = useState(false);
    return (
        <div className="password-wrapper">
            <input className="form-input" type={show ? 'text' : 'password'} placeholder={placeholder}
                required={required} value={value} onChange={onChange} autoComplete="current-password" />
            <button type="button" className="password-toggle" onClick={() => setShow(s => !s)} tabIndex={-1}>
                {show ? '🙈' : '👁️'}
            </button>
        </div>
    );
}

function Alert({ type = 'error', children, onDismiss }) {
    return (
        <div className={`alert alert-${type}`}>
            <span>{type === 'error' ? '❌' : type === 'success' ? '✅' : type === 'warning' ? '⚠️' : 'ℹ️'}</span>
            <span style={{ flex: 1 }}>{children}</span>
            {onDismiss && <button onClick={onDismiss} style={{ background: 'none', border: 'none', cursor: 'pointer', fontSize: '1.1rem', opacity: 0.6 }}>×</button>}
        </div>
    );
}

function useMsg() {
    const [msg, setMsg] = useState(null);
    const setMessage = useCallback((type, text) => {
        setMsg({ type, text });
        setTimeout(() => setMsg(null), type === 'error' ? 6000 : 4000);
    }, []);
    const clearMsg = useCallback(() => setMsg(null), []);
    return [msg, setMessage, clearMsg];
}

class ErrorBoundary extends React.Component {
    state = { hasError: false, error: null };
    static getDerivedStateFromError(e) { return { hasError: true, error: e }; }
    render() {
        if (this.state.hasError) return (
            <div className="auth-container">
                <div className="auth-card text-center">
                    <h2>⚠️ Something went wrong</h2>
                    <p className="text-muted mt-2">{this.state.error?.message}</p>
                    <button className="btn btn-primary mt-3" onClick={() => window.location.reload()}>Reload</button>
                </div>
            </div>
        );
        return this.props.children;
    }
}

// ==================== APP ====================
function App() {
    const [page, setPage] = useState('login');
    const [user, setUser] = useState(null);
    const [loading, setLoading] = useState(true);

    useEffect(() => {
        const t = localStorage.getItem('token');
        const u = localStorage.getItem('user');
        if (t && u) { try { setUser(JSON.parse(u)); setPage('dashboard'); } catch(e) { localStorage.clear(); } }
        setLoading(false);
    }, []);

    const login = (u, t) => { localStorage.setItem('token', t); localStorage.setItem('user', JSON.stringify(u)); setUser(u); setPage('dashboard'); };
    const logout = () => { localStorage.clear(); setUser(null); setPage('login'); };

    if (loading) return <div className="auth-container"><div className="spinner"></div></div>;

    return (
        <ErrorBoundary>
            {page === 'login' && <LoginPage onLogin={login} onRegister={() => setPage('register')} />}
            {page === 'register' && <RegisterPage onSuccess={() => setPage('login')} onLogin={() => setPage('login')} />}
            {page === 'dashboard' && user && <Dashboard user={user} onLogout={logout} setPage={setPage} />}
            {page === 'admin' && user?.role === 'admin' && <AdminPanel user={user} onLogout={logout} setPage={setPage} />}
            {page === 'collector' && user?.role === 'collector' && <CollectorPanel user={user} onLogout={logout} setPage={setPage} />}
            {page === 'borrower' && user?.role === 'borrower' && <BorrowerPanel user={user} onLogout={logout} setPage={setPage} />}
        </ErrorBoundary>
    );
}

// ==================== LOGIN ====================
function LoginPage({ onLogin, onRegister }) {
    const [form, setForm] = useState({ email: '', password: '' });
    const [msg, setMsg, clearMsg] = useMsg();
    const [loading, setLoading] = useState(false);

    const submit = async (e) => {
        e.preventDefault();
        if (!form.email.trim()) return setMsg('error', 'Please enter your email address');
        if (!form.password) return setMsg('error', 'Please enter your password');
        setLoading(true);
        try { const res = await API.post('/api/auth/login', form); onLogin(res.data.user, res.data.token); }
        catch (err) { setMsg('error', err.response?.data?.error || 'Login failed. Please try again.'); }
        finally { setLoading(false); }
    };

    return (
        <div className="auth-container">
            <div className="auth-card">
                <div className="text-center mb-2">
                    <div style={{ fontSize: '3rem', marginBottom: '10px' }}>📍</div>
                    <h1 style={{ background: 'linear-gradient(135deg, #667eea, #764ba2)', WebkitBackgroundClip: 'text', WebkitTextFillColor: 'transparent', fontSize: '1.8rem' }}>GPS Debt Collection</h1>
                    <p className="text-muted">Sign in to your account</p>
                </div>
                {msg && <Alert type={msg.type} onDismiss={clearMsg}>{msg.text}</Alert>}
                <form onSubmit={submit}>
                    <div className="form-group">
                        <label className="form-label">Email</label>
                        <input className="form-input" type="email" placeholder="Enter your email" required value={form.email} onChange={e => setForm({...form, email: e.target.value})} />
                    </div>
                    <div className="form-group">
                        <label className="form-label">Password</label>
                        <PasswordInput value={form.password} onChange={e => setForm({...form, password: e.target.value})} placeholder="Enter your password" required />
                    </div>
                    <button className="btn btn-primary btn-block btn-lg" type="submit" disabled={loading}>
                        {loading ? '⏳ Signing in...' : '🔐 Sign In'}
                    </button>
                </form>

            </div>
        </div>
    );
}

// ==================== REGISTER ====================
function RegisterPage({ onSuccess, onLogin }) {
    const [form, setForm] = useState({ name:'', email:'', password:'', confirmPassword:'', phone:'', street:'', barangay:'', city:'', province:'', zip_code:'', latitude: null, longitude: null });
    const [msg, setMsg, clearMsg] = useMsg();
    const [loading, setLoading] = useState(false);
    const [gettingLocation, setGettingLocation] = useState(false);

    const getLocation = () => {
        if (!navigator.geolocation) return setMsg('error', 'Geolocation is not supported by your browser');
        setGettingLocation(true);
        navigator.geolocation.getCurrentPosition(
            (pos) => { setForm(f => ({...f, latitude: pos.coords.latitude, longitude: pos.coords.longitude})); setGettingLocation(false); },
            (err) => {
                const msg = err.code === 1 ? 'Location permission denied. You can still register — we will geocode your address instead.'
                    : err.code === 2 ? 'Location unavailable. Your address will be used for geocoding.'
                    : 'Location request timed out. Proceeding with address-based location.';
                setMsg('warning', msg);
                setGettingLocation(false);
            },
            { enableHighAccuracy: true, timeout: 10000 }
        );
    };

    const update = (field, value) => setForm(f => ({...f, [field]: value}));

    const submit = async (e) => {
        e.preventDefault();
        clearMsg();
        if (!form.name.trim() || form.name.trim().length < 2) return setMsg('error', 'Full name must be at least 2 characters');
        if (!form.email.trim()) return setMsg('error', 'Email address is required');
        if (!form.password) return setMsg('error', 'Password is required');
        if (form.password.length < 6) return setMsg('error', 'Password must be at least 6 characters');
        if (form.password !== form.confirmPassword) return setMsg('error', 'Passwords do not match');
        if (!form.street.trim() || !form.barangay.trim() || !form.city.trim()) return setMsg('error', 'Street, barangay, and city are required');
        setLoading(true);
        try {
            const res = await API.post('/api/auth/register', { name: form.name, email: form.email, password: form.password, phone: form.phone, street: form.street, barangay: form.barangay, city: form.city, province: form.province, zip_code: form.zip_code, latitude: form.latitude, longitude: form.longitude });
            setMsg('success', res.data.message || 'Registration successful!');
            setTimeout(() => onSuccess(), 2500);
        } catch (err) { setMsg('error', err.response?.data?.error || 'Registration failed. Please try again.'); }
        finally { setLoading(false); }
    };

    return (
        <div className="auth-container">
            <div className="auth-card" style={{ maxWidth: '600px' }}>
                <div className="text-center mb-2">
                    <h2 style={{ background: 'linear-gradient(135deg, #667eea, #764ba2)', WebkitBackgroundClip: 'text', WebkitTextFillColor: 'transparent' }}>Create Account</h2>
                    <p className="text-muted">Register for the GPS Debt Collection System</p>
                </div>
                {msg && <Alert type={msg.type} onDismiss={clearMsg}>{msg.text}</Alert>}
                <form onSubmit={submit}>
                    <div className="form-group"><label className="form-label">Full Name <span className="required">*</span></label><input className="form-input" type="text" placeholder="Juan Dela Cruz" required value={form.name} onChange={e => update('name', e.target.value)} /></div>
                    <div className="form-row">
                        <div className="form-group"><label className="form-label">Email <span className="required">*</span></label><input className="form-input" type="email" placeholder="juan@email.com" required value={form.email} onChange={e => update('email', e.target.value)} /></div>
                        <div className="form-group"><label className="form-label">Phone</label><input className="form-input" type="tel" placeholder="09123456789" value={form.phone} onChange={e => update('phone', e.target.value)} /></div>
                    </div>
                    <div className="form-row">
                        <div className="form-group"><label className="form-label">Password <span className="required">*</span> <span style={{fontSize:'0.78rem',color:'var(--text-secondary)'}}>(min 6 chars)</span></label><PasswordInput value={form.password} onChange={e => update('password', e.target.value)} required /></div>
                        <div className="form-group"><label className="form-label">Confirm Password <span className="required">*</span></label><PasswordInput value={form.confirmPassword} onChange={e => update('confirmPassword', e.target.value)} required /></div>
                    </div>
                    <div className="card" style={{ background: '#f8f9fa', boxShadow: 'none', marginBottom: '16px', padding: '20px' }}>
                        <h4 style={{ marginBottom: '12px' }}>📍 Address Information</h4>
                        <div className="form-group"><label className="form-label">Street / House No. <span className="required">*</span></label><input className="form-input" type="text" placeholder="123 Rizal Street" required value={form.street} onChange={e => update('street', e.target.value)} /></div>
                        <div className="form-row">
                            <div className="form-group"><label className="form-label">Barangay <span className="required">*</span></label><input className="form-input" type="text" placeholder="Barangay" required value={form.barangay} onChange={e => update('barangay', e.target.value)} /></div>
                            <div className="form-group"><label className="form-label">City / Municipality <span className="required">*</span></label><input className="form-input" type="text" placeholder="City" required value={form.city} onChange={e => update('city', e.target.value)} /></div>
                        </div>
                        <div className="form-row">
                            <div className="form-group"><label className="form-label">Province</label><input className="form-input" type="text" placeholder="Province" value={form.province} onChange={e => update('province', e.target.value)} /></div>
                            <div className="form-group"><label className="form-label">Zip Code</label><input className="form-input" type="text" placeholder="e.g. 9000" value={form.zip_code} onChange={e => update('zip_code', e.target.value)} /></div>
                        </div>
                    </div>
                    <div className="card" style={{ background: '#f8f9fa', boxShadow: 'none', marginBottom: '16px', padding: '20px' }}>
                        <h4 style={{ marginBottom: '4px' }}>📍 GPS Location <span style={{fontSize:'0.8rem',color:'var(--text-secondary)',fontWeight:400}}>(Optional)</span></h4>
                        <p className="text-muted" style={{ fontSize: '0.83rem', marginBottom: '12px' }}>
                            Allow location access for faster collector assignment. If you skip this, your address will be used to estimate your location automatically.
                        </p>
                        <button type="button" className="btn btn-outline" onClick={getLocation} disabled={gettingLocation}>
                            {gettingLocation ? '📍 Getting location...' : form.latitude ? '✅ Location captured — click to update' : '📍 Get My Current Location'}
                        </button>
                        {form.latitude
                            ? <p style={{ marginTop: '10px', fontSize: '0.85rem', color: '#137333' }}>✅ GPS: {form.latitude.toFixed(6)}, {form.longitude.toFixed(6)}</p>
                            : <div className="gps-fallback-box mt-1"><strong>ℹ️ No GPS? No problem!</strong>Your address will be geocoded automatically after registration so collectors can still find you on the map.</div>
                        }
                    </div>
                    <button className="btn btn-primary btn-block btn-lg" type="submit" disabled={loading}>
                        {loading ? '⏳ Registering...' : '📝 Create Account'}
                    </button>
                </form>
                <p className="text-center mt-3">Already have an account? <a href="#" onClick={e => { e.preventDefault(); onLogin(); }} style={{ color: 'var(--primary)', fontWeight: 600 }}>Sign In</a></p>
            </div>
        </div>
    );
}

    );

// ==================== ML RISK DASHBOARD ====================
function MLRiskDashboard() {
    const [riskData, setRiskData] = useState(null);
    const [loading, setLoading] = useState(true);
    const [filter, setFilter] = useState('All');
    const [selectedBorrower, setSelectedBorrower] = useState(null);
    const [manualForm, setManualForm] = useState({ balance: '', loan_amount: '', days_past_due: '', payment_count: '', months_active: '', overdue_loans: '', active_loans: '1', has_gps: true, paid_loans: '' });
    const [manualResult, setManualResult] = useState(null);
    const [manualLoading, setManualLoading] = useState(false);
    const [activeView, setActiveView] = useState('portfolio');
    const [manualMsg, setManualMsg, clearManualMsg] = useMsg();

    useEffect(() => { loadRiskData(); }, []);

    const loadRiskData = async () => {
        setLoading(true);
        try { const res = await API.get('/api/ml/risk'); setRiskData(res.data); }
        catch (e) { console.error(e); }
        finally { setLoading(false); }
    };

    const runManualPredict = async () => {
        clearManualMsg();
        if (!manualForm.balance) return setManualMsg('error', 'Outstanding balance is required');
        if (parseFloat(manualForm.balance) < 0) return setManualMsg('error', 'Balance cannot be negative');
        setManualLoading(true); setManualResult(null);
        try {
            const res = await API.post('/api/ml/predict', { ...manualForm, has_gps: manualForm.has_gps === true || manualForm.has_gps === 'true' });
            setManualResult(res.data);
        } catch (e) { setManualMsg('error', e.response?.data?.error || 'Prediction failed'); }
        finally { setManualLoading(false); }
    };

    const updateManual = (k, v) => setManualForm(f => ({ ...f, [k]: v }));
    const riskColor = (level) => level === 'High' ? '#c5221f' : level === 'Medium' ? '#b06000' : '#137333';
    const riskBg = (level) => level === 'High' ? '#fce8e6' : level === 'Medium' ? '#fef7e0' : '#e6f4ea';
    const riskBarColor = (score) => score >= 65 ? '#c5221f' : score >= 35 ? '#e6a817' : '#0d904f';
    const filteredResults = riskData?.results?.filter(r => filter === 'All' || r.risk_level === filter) || [];

    if (loading) return <div className="spinner"></div>;
    if (!riskData) return <Alert type="error">Failed to load risk data. Please refresh.</Alert>;

    return (
        <div>
            <div style={{ display: 'flex', gap: '8px', marginBottom: '18px' }}>
                <button className={`ml-filter-btn ${activeView === 'portfolio' ? 'active-filter' : ''}`} onClick={() => setActiveView('portfolio')}>📊 Portfolio Risk</button>
                <button className={`ml-filter-btn ${activeView === 'manual' ? 'active-filter' : ''}`} onClick={() => setActiveView('manual')}>🔬 Manual Classifier</button>
            </div>

            {activeView === 'portfolio' && (
                <div>
                    <div className="ml-summary-grid">
                        <div className="ml-stat"><div className="ml-stat-val">{riskData.summary.total}</div><div className="ml-stat-label">Total Borrowers</div></div>
                        <div className="ml-stat high"><div className="ml-stat-val">{riskData.summary.high}</div><div className="ml-stat-label">High Risk</div></div>
                        <div className="ml-stat medium"><div className="ml-stat-val">{riskData.summary.medium}</div><div className="ml-stat-label">Medium Risk</div></div>
                        <div className="ml-stat low"><div className="ml-stat-val">{riskData.summary.low}</div><div className="ml-stat-label">Low Risk</div></div>
                        <div className="ml-stat avg"><div className="ml-stat-val">{riskData.summary.avg_score}</div><div className="ml-stat-label">Avg Score</div></div>
                    </div>
                    <div className="ml-filter-row">
                        <span style={{ fontSize: '0.85rem', color: 'var(--text-secondary)' }}>Filter:</span>
                        {['All','High','Medium','Low'].map(f => (
                            <button key={f} className={`ml-filter-btn ${f.toLowerCase()}-filter ${filter === f ? 'active-filter' : ''}`} onClick={() => { setFilter(f); setSelectedBorrower(null); }}>
                                {f === 'High' ? '🔴' : f === 'Medium' ? '🟡' : f === 'Low' ? '🟢' : '📋'} {f}
                            </button>
                        ))}
                        <button className="ml-filter-btn" onClick={loadRiskData} style={{ marginLeft: 'auto' }}>🔄 Refresh</button>
                    </div>
                    {filteredResults.length === 0 ? <p className="text-muted" style={{ padding: '20px 0' }}>No borrowers in this category.</p> : (
                        <div className="table-container">
                            <table className="table">
                                <thead><tr><th>Borrower</th><th>City</th><th>Risk Level</th><th>Score</th><th>DPD</th><th>Loans</th><th>Payments</th><th>Location</th><th>Details</th></tr></thead>
                                <tbody>
                                    {filteredResults.map(r => (
                                        <tr key={r.borrower_id}>
                                            <td><strong>{r.borrower}</strong></td>
                                            <td style={{ fontSize: '0.82rem' }}>{r.city || '—'}</td>
                                            <td><span style={{ background: riskBg(r.risk_level), color: riskColor(r.risk_level), padding: '4px 12px', borderRadius: '20px', fontSize: '0.75rem', fontWeight: 700 }}>
                                                {r.risk_level === 'High' ? '🔴' : r.risk_level === 'Medium' ? '🟡' : '🟢'} {r.risk_level}
                                            </span></td>
                                            <td><div className="risk-bar-wrap"><div className="risk-bar-bg"><div className="risk-bar-fill" style={{ width: r.risk_score + '%', background: riskBarColor(r.risk_score) }}></div></div><span className="risk-score-num" style={{ color: riskBarColor(r.risk_score) }}>{r.risk_score}</span></div></td>
                                            <td style={{ fontSize: '0.85rem' }}>{r.factors.days_past_due > 0 ? <span style={{ color: '#c5221f', fontWeight: 600 }}>{r.factors.days_past_due}d</span> : '—'}</td>
                                            <td style={{ textAlign: 'center' }}>{r.active_loans}</td>
                                            <td style={{ textAlign: 'center' }}>{r.total_payments}</td>
                                            <td>
                                                {r.factors.has_gps ? <span className="gps-indicator gps-active" style={{fontSize:'0.75rem'}}><span className="gps-dot active"></span> GPS</span>
                                                    : r.factors.has_geocoded ? <span className="gps-indicator gps-geocoded" style={{fontSize:'0.75rem'}}><span className="gps-dot geocoded"></span> Addr</span>
                                                    : <span className="gps-indicator gps-inactive" style={{fontSize:'0.75rem'}}><span className="gps-dot inactive"></span> None</span>}
                                            </td>
                                            <td><button className="btn btn-outline btn-sm" onClick={() => setSelectedBorrower(selectedBorrower?.borrower_id === r.borrower_id ? null : r)}>{selectedBorrower?.borrower_id === r.borrower_id ? '▲ Hide' : '▼ Show'}</button></td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    )}
                    {selectedBorrower && (
                        <div className="ml-detail-card" style={{ borderLeft: `4px solid ${riskColor(selectedBorrower.risk_level)}` }}>
                            <div className="ml-detail-header">
                                <span style={{ background: riskBg(selectedBorrower.risk_level), color: riskColor(selectedBorrower.risk_level), padding: '4px 12px', borderRadius: '20px', fontSize: '0.8rem', fontWeight: 700 }}>{selectedBorrower.risk_level} Risk — Score {selectedBorrower.risk_score}/100</span>
                                <strong>{selectedBorrower.borrower}</strong>
                            </div>

                                <div>
                                    <p style={{ fontSize: '0.85rem', fontWeight: 600, marginBottom: '8px' }}>📊 Risk Factors</p>

                                        <div key={l} className="ml-factor-row"><span className="ml-factor-label">{l}</span><span className="ml-factor-val">{v}</span></div>

                                </div>
                                <div>
                                    <p style={{ fontSize: '0.85rem', fontWeight: 600, marginBottom: '8px' }}>🎯 Score Breakdown</p>
                                    <div className="score-breakdown-grid">
                                        {selectedBorrower.factors.scores_breakdown && Object.entries(selectedBorrower.factors.scores_breakdown).map(([k, v]) => (
                                            <div key={k} className="score-chip"><span className="score-chip-label">{k.replace(/_/g,' ')}</span><span className="score-chip-val" style={{ color: v < 0 ? '#137333' : v > 10 ? '#c5221f' : '#b06000' }}>{v > 0 ? '+' : ''}{v}</span></div>

                            <p style={{ fontSize: '0.85rem', fontWeight: 600, marginTop: '14px', marginBottom: '8px' }}>📋 Recommended Strategies</p>
                            <div className="ml-strategy-list">
                                {selectedBorrower.strategies.map((s, i) => <div key={i} className={`ml-strategy-item ${selectedBorrower.risk_level.toLowerCase()}`}>{s}</div>)}

                    )}
                </div>
            )}

            {activeView === 'manual' && (
                <div>
                    <p className="text-muted" style={{ marginBottom: '16px', fontSize: '0.9rem' }}>Enter debtor details manually to get an instant ML risk classification — no database record required.</p>
                    {manualMsg && <Alert type={manualMsg.type} onDismiss={clearManualMsg}>{manualMsg.text}</Alert>}
                    <div className="ml-manual-form">
                        <div className="form-group"><label className="form-label">Outstanding Balance (₱) <span className="required">*</span></label><input className="form-input" type="number" min="0" placeholder="e.g. 45000" value={manualForm.balance} onChange={e => updateManual('balance', e.target.value)} /></div>
                        <div className="form-group"><label className="form-label">Original Loan Amount (₱)</label><input className="form-input" type="number" min="0" placeholder="e.g. 50000" value={manualForm.loan_amount} onChange={e => updateManual('loan_amount', e.target.value)} /></div>

                                <div>
                                    <div className="ml-result-title" style={{ color: riskColor(manualResult.risk_level) }}>{manualResult.risk_level === 'High' ? '🔴' : manualResult.risk_level === 'Medium' ? '🟡' : '🟢'} {manualResult.risk_level} Risk</div>
                                    <p style={{ fontSize: '0.85rem', color: 'var(--text-secondary)', marginTop: '4px' }}>
                                        {manualResult.risk_level === 'High' ? 'Immediate escalation required.' : manualResult.risk_level === 'Medium' ? 'Proactive engagement recommended.' : 'Minimal intervention needed.'}
                                    </p>
                                </div>
                                <div style={{ textAlign: 'right' }}><div className="ml-result-score" style={{ color: riskColor(manualResult.risk_level) }}>{manualResult.risk_score}</div><div style={{ fontSize: '0.8rem', color: 'var(--text-secondary)' }}>/ 100</div></div>
                            </div>
                            <div style={{ margin: '14px 0 8px', height: '10px', background: 'rgba(0,0,0,0.1)', borderRadius: '99px', overflow: 'hidden' }}>
                                <div style={{ width: manualResult.risk_score + '%', height: '100%', background: riskColor(manualResult.risk_level), borderRadius: '99px' }}></div>
                            </div>
                            <p style={{ fontSize: '0.85rem', fontWeight: 600, margin: '14px 0 8px' }}>📋 Recommended Strategies</p>
                            <div className="ml-strategy-list">{manualResult.strategies.map((s, i) => <div key={i} className={`ml-strategy-item ${manualResult.risk_level.toLowerCase()}`}>{s}</div>)}</div>
                        </div>
                    )}
                </div>
            )}
        </div>
    );
}

// ==================== ADMIN PANEL ====================
function AdminPanel({ user, onLogout, setPage }) {
    const [tab, setTab] = useState('users');
    const [users, setUsers] = useState([]);
    const [borrowers, setBorrowers] = useState([]);
    const [loans, setLoans] = useState([]);
    const [payments, setPayments] = useState([]);
    const [collectors, setCollectors] = useState([]);
    const [assignments, setAssignments] = useState([]);
    const [gpsBorrowers, setGpsBorrowers] = useState([]);
    const [loanApps, setLoanApps] = useState([]);
    const [showAssignModal, setShowAssignModal] = useState(false);
    const [assignForm, setAssignForm] = useState({ collector_id: '', borrower_id: '' });
    const [reviewModal, setReviewModal] = useState(null);
    const [reviewForm, setReviewForm] = useState({ status: '', admin_notes: '', final_amount: '', final_interest_rate: '', final_due_date: '' });
    const [msg, setMsg, clearMsg] = useMsg();
    const [geocodingId, setGeocodingId] = useState(null);

    useEffect(() => { loadData(); }, []);

    const pendingApps = loanApps.filter(a => a.status === 'pending').length;
    const pendingUsers = users.filter(u => u.status === 'pending').length;

    const loadData = async () => {
        try {
            // Load each endpoint separately with error handling
            const usersRes = await API.get('/api/users').catch(err => {
                console.error('Failed to load users:', err);
                return { data: [] };
            });
            setUsers(usersRes.data);

            const borrowersRes = await API.get('/api/borrowers').catch(err => {
                console.error('Failed to load borrowers:', err);
                return { data: [] };
            });
            setBorrowers(borrowersRes.data);

            const loansRes = await API.get('/api/loans').catch(err => {
                console.error('Failed to load loans:', err);
                return { data: [] };
            });
            setLoans(loansRes.data);

            const paymentsRes = await API.get('/api/payments').catch(err => {
                console.error('Failed to load payments:', err);
                return { data: [] };
            });
            setPayments(paymentsRes.data);

            const collectorsRes = await API.get('/api/collectors').catch(err => {
                console.error('Failed to load collectors:', err);
                return { data: [] };
            });
            setCollectors(collectorsRes.data);

            const assignmentsRes = await API.get('/api/assignments').catch(err => {
                console.error('Failed to load assignments:', err);
                return { data: [] };
            });
            setAssignments(assignmentsRes.data);

            const gpsRes = await API.get('/api/gps/borrowers').catch(err => {
                console.error('Failed to load GPS data:', err);
                return { data: [] };
            });
            setGpsBorrowers(gpsRes.data);

            const appsRes = await API.get('/api/loan-applications').catch(err => {
                console.error('Failed to load loan applications:', err);
                return { data: [] };
            });
            setLoanApps(appsRes.data);
            
        } catch (e) {
            console.error('Data loading error:', e);
            setMsg('error', 'Failed to load data. Please refresh the page.');
        }
    };

    const assignCollector = async (e) => {
        e.preventDefault();
        if (!assignForm.collector_id) return setMsg('error', 'Please select a collector');
        if (!assignForm.borrower_id) return setMsg('error', 'Please select a borrower');
        try { await API.post('/api/assignments', assignForm); setMsg('success', 'Collector assigned successfully!'); setShowAssignModal(false); loadData(); }
        catch (e) { setMsg('error', e.response?.data?.error || 'Assignment failed'); }
    };

    const openReview = (app) => {
        setReviewModal(app);
        setReviewForm({ status: '', admin_notes: '', final_amount: app.requested_amount, final_interest_rate: app.requested_interest_rate, final_due_date: app.requested_due_date ? app.requested_due_date.slice(0,10) : '' });
    };

    const submitReview = async (e) => {
        e.preventDefault();
        if (!reviewForm.status) return setMsg('error', 'Please select Approve or Reject');
        if (reviewForm.status === 'approved') {
            if (!reviewForm.final_amount || parseFloat(reviewForm.final_amount) <= 0) return setMsg('error', 'Loan amount must be greater than 0');
            if (parseFloat(reviewForm.final_interest_rate) < 0) return setMsg('error', 'Interest rate cannot be negative');
            if (!reviewForm.final_due_date) return setMsg('error', 'Due date is required');
            if (new Date(reviewForm.final_due_date) <= new Date()) return setMsg('error', 'Due date must be in the future');
        }
        try {
            await API.put(`/api/loan-applications/${reviewModal.application_id}/review`, reviewForm);
            setMsg('success', `Application ${reviewForm.status} successfully!`);
            setReviewModal(null);
            loadData();
        } catch (e) { setMsg('error', e.response?.data?.error || 'Review failed'); }
    };

    const geocodeBorrower = async (borrowerId, name) => {
        setGeocodingId(borrowerId);
        try {
            const res = await API.post('/api/gps/geocode-borrower', { borrower_id: borrowerId });
            setMsg('success', `📍 ${name}: ${res.data.message}`);
            loadData();
        } catch (e) { setMsg('error', e.response?.data?.error || 'Geocoding failed'); }
        finally { setGeocodingId(null); }
    };

    const tabs = [
        { id: 'users', label: '👥 Users', badge: pendingUsers },
        { id: 'applications', label: '📄 Loan Applications', badge: pendingApps },
        { id: 'borrowers', label: '🏠 Borrowers' },
        { id: 'loans', label: '💰 Loans' },
        { id: 'payments', label: '💳 Payments' },
        { id: 'assignments', label: '📋 Assignments' },
        { id: 'gps', label: '📍 GPS' },
        { id: 'ml', label: '🤖 ML Risk' },
    ];

    return (
        <div>
            <nav className="navbar">
                <span className="navbar-brand">📍 Admin Panel</span>
                <div className="navbar-actions">
                    <button className="btn btn-outline btn-sm" onClick={() => setPage('dashboard')}>📊 Dashboard</button>
                    <button className="btn btn-danger btn-sm" onClick={onLogout}>🚪 Logout</button>
                </div>
            </nav>
            <div className="container">
                {msg && <Alert type={msg.type} onDismiss={clearMsg}>{msg.text}</Alert>}

                <div className="tabs">
                    {tabs.map(t => (
                        <button key={t.id} className={`tab ${tab === t.id ? 'active' : ''}`} onClick={() => setTab(t.id)}>
                            {t.label}{t.badge > 0 && <span className="tab-badge">{t.badge}</span>}
                        </button>
                    ))}
                </div>

                {/* ── USERS ── */}
                {tab === 'users' && (
                    <div className="card">
                        <div className="card-header flex flex-between">
                            <span>User Management</span>
                            <span className="text-muted" style={{fontSize:'0.85rem'}}>{users.length} total users</span>
                        </div>
                        <div className="table-container">
                            <table className="table">
                                <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Address</th><th>GPS</th><th>Actions</th></tr></thead>
                                <tbody>
                                    {users.map(u => (
                                        <tr key={u.user_id}>
                                            <td><strong>{u.name}</strong></td>
                                            <td style={{fontSize:'0.85rem'}}>{u.email}</td>
                                            <td>
                                                {u.email === 'admin@system.com' ? <span className="badge badge-purple">{u.role}</span> : (
                                                    <select className="form-select" style={{padding:'4px 8px',fontSize:'0.8rem',width:'130px'}} value={u.role}
                                                        onChange={async (e) => {
                                                            try { await API.put(`/api/users/${u.user_id}/role`, { role: e.target.value }); setMsg('success', `Role updated to ${e.target.value}`); loadData(); }
                                                            catch (err) { setMsg('error', err.response?.data?.error || 'Failed to update role'); }
                                                        }}>
                                                        <option value="pending_user">Pending User</option>
                                                        <option value="borrower">Borrower</option>
                                                        <option value="collector">Collector</option>
                                                        <option value="admin">Admin</option>
                                                    </select>
                                                )}
                                            </td>
                                            <td><span className={`badge ${u.status==='approved'?'badge-success':u.status==='pending'?'badge-warning':'badge-danger'}`}>{u.status}</span></td>
                                            <td style={{fontSize:'0.78rem'}}>{[u.street,u.barangay,u.city].filter(Boolean).join(', ')||'N/A'}</td>
                                            <td>{u.latitude ? <span className="gps-indicator gps-active" style={{fontSize:'0.75rem'}}><span className="gps-dot active"></span>Yes</span> : <span className="gps-indicator gps-inactive" style={{fontSize:'0.75rem'}}><span className="gps-dot inactive"></span>No</span>}</td>
                                            <td>
                                                {u.email !== 'admin@system.com' && u.status === 'pending' && (
                                                    <div style={{display:'flex',gap:'5px',flexDirection:'column'}}>
                                                        <select id={`role-sel-${u.user_id}`} className="form-select" style={{padding:'4px 8px',fontSize:'0.75rem',width:'130px'}} defaultValue="borrower">
                                                            <option value="borrower">As Borrower</option>
                                                            <option value="collector">As Collector</option>
                                                        </select>
                                                        <div style={{display:'flex',gap:'4px'}}>
                                                            <button className="btn btn-success btn-sm" onClick={async () => {
                                                                const sel = document.getElementById(`role-sel-${u.user_id}`);
                                                                try { const res = await API.put(`/api/users/${u.user_id}/status`, { status: 'approved', role: sel?.value||'borrower' }); setMsg('success', res.data.message||'User approved!'); loadData(); }
                                                                catch (err) { setMsg('error', err.response?.data?.error||'Approval failed'); }
                                                            }}>✅ Approve</button>
                                                            <button className="btn btn-danger btn-sm" onClick={async () => {
                                                                if (!window.confirm(`Reject ${u.name}?`)) return;
                                                                try { await API.put(`/api/users/${u.user_id}/status`, { status: 'rejected' }); setMsg('success', 'User rejected'); loadData(); }
                                                                catch (err) { setMsg('error', 'Failed to reject user'); }
                                                            }}>❌</button>
                                                        </div>
                                                    </div>
                                                )}
                                                {u.email !== 'admin@system.com' && u.status === 'rejected' && (
                                                    <button className="btn btn-success btn-sm" onClick={async () => {
                                                        const r = prompt('Assign role? (borrower/collector)', 'borrower');
                                                        if (r && ['borrower','collector'].includes(r.toLowerCase())) {
                                                            try { await API.put(`/api/users/${u.user_id}/status`, { status: 'approved', role: r.toLowerCase() }); setMsg('success', 'User re-approved!'); loadData(); }
                                                            catch (err) { setMsg('error', err.response?.data?.error||'Failed'); }
                                                        } else if (r) setMsg('error', 'Role must be borrower or collector');
                                                    }}>🔄 Re-approve</button>
                                                )}
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>
                )}

                {/* ── LOAN APPLICATIONS ── */}
                {tab === 'applications' && (
                    <div className="card">
                        <div className="card-header flex flex-between">
                            <span>📄 Loan Applications from Borrowers</span>
                            <span className="text-muted" style={{fontSize:'0.85rem'}}>{pendingApps} pending</span>
                        </div>
                        {loanApps.length === 0 ? <p className="text-muted">No loan applications yet.</p> : (
                            <div className="table-container">
                                <table className="table">
                                    <thead><tr><th>Borrower</th><th>Amount</th><th>Interest</th><th>Due Date</th><th>Purpose</th><th>Status</th><th>Submitted</th><th>Action</th></tr></thead>
                                    <tbody>
                                        {loanApps.map(a => (
                                            <tr key={a.application_id}>
                                                <td><strong>{a.borrower_name}</strong><br/><span style={{fontSize:'0.78rem',color:'var(--text-secondary)'}}>{a.city}</span></td>
                                                <td>{fmtCurrency(a.requested_amount)}</td>
                                                <td>{parseFloat(a.requested_interest_rate)}%</td>
                                                <td style={{fontSize:'0.85rem'}}>{fmtDate(a.requested_due_date)}</td>
                                                <td style={{fontSize:'0.82rem',maxWidth:'120px'}}>{a.purpose || '—'}</td>
                                                <td>
                                                    <span className={`badge ${a.status==='approved'?'badge-success':a.status==='pending'?'badge-warning':'badge-danger'}`}>{a.status}</span>
                                                    {a.admin_notes && <p style={{fontSize:'0.75rem',color:'var(--text-secondary)',marginTop:'3px'}}>📝 {a.admin_notes}</p>}
                                                </td>
                                                <td style={{fontSize:'0.82rem'}}>{fmtDate(a.created_at)}</td>
                                                <td>
                                                    {a.status === 'pending' && (
                                                        <button className="btn btn-primary btn-sm" onClick={() => openReview(a)}>📋 Review</button>
                                                    )}
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        )}
                    </div>
                )}

                {/* ── BORROWERS ── */}
                {tab === 'borrowers' && (
                    <div className="card">
                        <div className="flex flex-between mb-2">
                            <div className="card-header" style={{margin:0}}>Borrowers</div>
                            <button className="btn btn-warning btn-sm" onClick={() => { setAssignForm({collector_id:'',borrower_id:''}); setShowAssignModal(true); }}>👤 Assign Collector</button>
                        </div>
                        <div className="table-container">
                            <table className="table">
                                <thead><tr><th>Name</th><th>Address</th><th>GPS Status</th><th>Collector</th></tr></thead>
                                <tbody>
                                    {borrowers.map(b => (
                                        <tr key={b.borrower_id}>
                                            <td><strong>{b.full_name}</strong></td>
                                            <td style={{fontSize:'0.82rem'}}>{[b.street,b.barangay,b.city].filter(Boolean).join(', ')||'N/A'}</td>
                                            <td>
                                                {b.latitude ? <span className="gps-indicator gps-active" style={{fontSize:'0.78rem'}}><span className="gps-dot active"></span> Live GPS</span>
                                                    : b.geocoded_lat ? <span className="gps-indicator gps-geocoded" style={{fontSize:'0.78rem'}}><span className="gps-dot geocoded"></span> Geocoded</span>
                                                    : (
                                                        <div style={{display:'flex',alignItems:'center',gap:'6px'}}>
                                                            <span className="gps-indicator gps-inactive" style={{fontSize:'0.78rem'}}><span className="gps-dot inactive"></span> No GPS</span>
                                                            <button className="btn btn-outline btn-sm" style={{fontSize:'0.72rem',padding:'3px 8px'}} disabled={geocodingId === b.borrower_id} onClick={() => geocodeBorrower(b.borrower_id, b.full_name)}>
                                                                {geocodingId === b.borrower_id ? '⏳' : '🗺️ Geocode'}
                                                            </button>
                                                        </div>
                                                    )
                                                }
                                            </td>
                                            <td>{b.collector_name || <span className="text-muted">Unassigned</span>}</td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>
                )}

                {/* ── LOANS ── */}
                {tab === 'loans' && (
                    <div className="card">
                        <div className="card-header">Loan Records</div>
                        <div className="table-container">
                            <table className="table">
                                <thead><tr><th>ID</th><th>Borrower</th><th>Amount</th><th>Interest</th><th>Balance</th><th>Due Date</th><th>Status</th></tr></thead>
                                <tbody>
                                    {loans.map(l => (
                                        <tr key={l.loan_id}>
                                            <td>#{l.loan_id}</td><td><strong>{l.borrower_name}</strong></td>
                                            <td>{fmtCurrency(l.loan_amount)}</td>
                                            <td>{l.interest_rate}%</td>
                                            <td>{fmtCurrency(l.balance)}</td>
                                            <td style={{fontSize:'0.85rem'}}>{fmtDate(l.due_date)}</td>
                                            <td><span className={`badge ${l.status==='active'?'badge-info':l.status==='paid'?'badge-success':'badge-danger'}`}>{l.status}</span></td>
                                        </tr>
                                    ))}
                                    {loans.length === 0 && <tr><td colSpan="7" style={{textAlign:'center',color:'var(--text-secondary)',padding:'20px'}}>No loans yet</td></tr>}
                                </tbody>
                            </table>
                        </div>
                    </div>
                )}

                {/* ── PAYMENTS ── */}
                {tab === 'payments' && (
                    <div className="card">
                        <div className="card-header">Payment Records</div>
                        <div className="table-container">
                            <table className="table">
                                <thead><tr><th>Receipt</th><th>Borrower</th><th>Collector</th><th>Amount</th><th>GPS</th><th>Date</th></tr></thead>
                                <tbody>
                                    {payments.map(p => (
                                        <tr key={p.payment_id}>
                                            <td style={{fontSize:'0.78rem'}}>{p.receipt_number}</td>
                                            <td>{p.borrower_name}</td><td>{p.collector_name||'—'}</td>
                                            <td><strong>{fmtCurrency(p.amount)}</strong></td>
                                            <td>{p.latitude ? '📍 Tracked' : '—'}</td>
                                            <td style={{fontSize:'0.85rem'}}>{fmtDatetime(p.payment_date)}</td>
                                        </tr>
                                    ))}
                                    {payments.length === 0 && <tr><td colSpan="6" style={{textAlign:'center',color:'var(--text-secondary)',padding:'20px'}}>No payments yet</td></tr>}
                                </tbody>
                            </table>
                        </div>
                    </div>
                )}

                {/* ── ASSIGNMENTS ── */}
                {tab === 'assignments' && (
                    <div className="card">
                        <div className="flex flex-between mb-2">
                            <div className="card-header" style={{margin:0}}>Collection Assignments</div>
                            <button className="btn btn-warning btn-sm" onClick={() => { setAssignForm({collector_id:'',borrower_id:''}); setShowAssignModal(true); }}>➕ New Assignment</button>
                        </div>
                        <div className="table-container">
                            <table className="table">
                                <thead><tr><th>Borrower</th><th>Collector</th><th>Status</th><th>Date</th></tr></thead>
                                <tbody>
                                    {assignments.map(a => (
                                        <tr key={a.assignment_id}>
                                            <td>{a.borrower_name}</td><td>{a.collector_name}</td>
                                            <td><span className="badge badge-info">{a.status}</span></td>
                                            <td style={{fontSize:'0.85rem'}}>{fmtDate(a.assigned_date)}</td>
                                        </tr>
                                    ))}
                                    {assignments.length === 0 && <tr><td colSpan="4" style={{textAlign:'center',color:'var(--text-secondary)',padding:'20px'}}>No assignments yet</td></tr>}
                                </tbody>
                            </table>
                        </div>
                    </div>
                )}

                {/* ── GPS ── */}
                {tab === 'gps' && (
                    <div className="card">
                        <div className="card-header">📍 Borrower Location Map</div>
                        <div className="alert alert-info mb-2" style={{fontSize:'0.85rem'}}>
                            ℹ️ Borrowers who deny GPS sharing are automatically geocoded from their address. 🟢 = Live GPS &nbsp; 🔵 = Address-geocoded &nbsp; 🔴 = No location
                        </div>
                        <div className="grid grid-2">
                            {gpsBorrowers.map(b => (
                                <div key={b.borrower_id} className="card" style={{ background: '#f8f9fa', padding: '16px' }}>
                                    <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}>
                                        <strong>{b.full_name}</strong>
                                        {b.location_source === 'gps' ? <span className="gps-indicator gps-active" style={{fontSize:'0.75rem'}}><span className="gps-dot active"></span>Live GPS</span>
                                            : <span className="gps-indicator gps-geocoded" style={{fontSize:'0.75rem'}}><span className="gps-dot geocoded"></span>Geocoded</span>}
                                    </div>
                                    <p className="text-muted" style={{fontSize:'0.82rem',marginTop:'4px'}}>{[b.street,b.barangay,b.city].filter(Boolean).join(', ')}</p>
                                    <p style={{fontSize:'0.82rem',marginTop:'4px'}}>📍 {parseFloat(b.latitude).toFixed(6)}, {parseFloat(b.longitude).toFixed(6)}</p>
                                    {b.location_source === 'geocoded' && <p style={{fontSize:'0.75rem',color:'#1967d2',marginTop:'3px'}}>⚠️ Estimated from address — may not be exact</p>}

                        </div>
                    </div>
                )}

                {/* ── ML ── */}
                {tab === 'ml' && (
                    <div className="card">
                        <div className="card-header" style={{display:'flex',alignItems:'center',gap:'12px'}}>
