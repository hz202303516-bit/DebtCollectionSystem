<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPS Debt Collection System</title>
    <style>
        :root {
            --primary: #1a73e8;
            --primary-dark: #1557b0;
            --success: #0d904f;
            --danger: #d93025;
            --warning: #e6a817;
            --bg: #f0f2f5;
            --card: #ffffff;
            --text: #1f1f1f;
            --text-secondary: #5f6368;
            --border: #dadce0;
            --shadow: 0 1px 3px rgba(0,0,0,0.12), 0 1px 2px rgba(0,0,0,0.08);
            --shadow-lg: 0 10px 25px rgba(0,0,0,0.15);
            --radius: 12px;
            --transition: all 0.25s ease;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: var(--text);
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.05'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/G%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        .navbar {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            border-radius: var(--radius);
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            box-shadow: var(--shadow-lg);
        }
        .navbar-brand {
            font-size: 1.4rem;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .navbar-actions { display: flex; gap: 10px; align-items: center; }
        .navbar-user { color: var(--text-secondary); font-size: 0.9rem; }

        .card {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            border-radius: var(--radius);
            padding: 30px;
            box-shadow: var(--shadow-lg);
            margin-bottom: 20px;
        }
        .card-header {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 20px;
            color: var(--text);
        }

        .grid { display: grid; gap: 20px; }
        .grid-2 { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
        .grid-3 { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
        .grid-4 { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }

        .stat-card {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border-radius: var(--radius);
            padding: 25px;
            text-align: center;
        }
        .stat-card.green { background: linear-gradient(135deg, #11998e, #38ef7d); }
        .stat-card.orange { background: linear-gradient(135deg, #f2994a, #f2c94c); }
        .stat-card.red { background: linear-gradient(135deg, #eb3349, #f45c43); }
        .stat-value { font-size: 2.2rem; font-weight: 700; }
        .stat-label { font-size: 0.9rem; opacity: 0.9; margin-top: 5px; }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn:hover { transform: translateY(-1px); box-shadow: var(--shadow); }
        .btn:active { transform: translateY(0); }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-dark); }
        .btn-success { background: var(--success); color: white; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-warning { background: var(--warning); color: #1f1f1f; }
        .btn-outline { background: transparent; border: 2px solid var(--border); color: var(--text); }
        .btn-sm { padding: 6px 14px; font-size: 0.8rem; }
        .btn-lg { padding: 14px 28px; font-size: 1rem; }
        .btn-block { width: 100%; justify-content: center; }

        .form-group { margin-bottom: 16px; }
        .form-label { display: block; font-weight: 500; margin-bottom: 6px; color: var(--text); font-size: 0.9rem; }
        .form-input, .form-select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 0.95rem;
            transition: var(--transition);
            background: white;
        }
        .form-input:focus, .form-select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(26,115,232,0.1);
        }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

        .password-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }
        .password-wrapper .form-input { padding-right: 46px; }
        .password-toggle {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.1rem;
            color: var(--text-secondary);
            padding: 4px;
            line-height: 1;
            transition: color 0.2s;
            user-select: none;
        }
        .password-toggle:hover { color: var(--primary); }

        .table-container { overflow-x: auto; border-radius: var(--radius); }
        .table { width: 100%; border-collapse: collapse; }
        .table th {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 14px 16px;
            text-align: left;
            font-weight: 500;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .table td { padding: 12px 16px; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
        .table tr:hover td { background: rgba(102,126,234,0.05); }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        .badge-success { background: #e6f4ea; color: #137333; }
        .badge-warning { background: #fef7e0; color: #b06000; }
        .badge-danger { background: #fce8e6; color: #c5221f; }
        .badge-info { background: #e8f0fe; color: #1967d2; }
        .badge-purple { background: #f3e8fd; color: #7b1fa2; }

        .alert {
            padding: 14px 18px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: opacity 0.5s ease, transform 0.5s ease;
        }
        .alert-error { background: #fce8e6; color: #c5221f; border-left: 4px solid #c5221f; }
        .alert-success { background: #e6f4ea; color: #137333; border-left: 4px solid #137333; }
        .alert-info { background: #e8f0fe; color: #1967d2; border-left: 4px solid #1967d2; }
        .alert.dismissing { opacity: 0; transform: translateY(-10px); }

        .tabs { display: flex; gap: 5px; margin-bottom: 20px; flex-wrap: wrap; }
        .tab {
            padding: 10px 20px;
            border: none;
            background: transparent;
            cursor: pointer;
            border-radius: 8px;
            font-size: 0.9rem;
            transition: var(--transition);
            color: var(--text-secondary);
        }
        .tab:hover { background: rgba(102,126,234,0.08); }
        .tab.active { background: var(--primary); color: white; }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6);
            z-index: 1000;
            justify-content: center;
            align-items: flex-start;
            padding: 40px 20px;
            overflow-y: auto;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: white;
            border-radius: var(--radius);
            padding: 30px;
            width: 100%;
            max-width: 600px;
            box-shadow: var(--shadow-lg);
            animation: slideUp 0.3s ease;
        }
        @keyframes slideUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .modal-close {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-secondary);
            padding: 5px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 30px auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .auth-card {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            border-radius: var(--radius);
            padding: 40px;
            width: 100%;
            max-width: 520px;
            box-shadow: var(--shadow-lg);
        }

        .text-center { text-align: center; }
        .text-muted { color: var(--text-secondary); }
        .mt-1 { margin-top: 8px; }
        .mt-2 { margin-top: 16px; }
        .mt-3 { margin-top: 24px; }
        .mb-2 { margin-bottom: 16px; }
        .gap-2 { gap: 12px; }
        .flex { display: flex; }
        .flex-between { justify-content: space-between; }

        .risk-low { color: #137333; font-weight: 700; }
        .risk-medium { color: #b06000; font-weight: 700; }
        .risk-high { color: #c5221f; font-weight: 700; }

        /* ── ML Dashboard Styles ── */
        .ml-summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 14px;
            margin-bottom: 22px;
        }
        .ml-stat {
            background: white;
            border-radius: 10px;
            padding: 18px 14px;
            text-align: center;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
        }
        .ml-stat-val { font-size: 1.9rem; font-weight: 700; }
        .ml-stat-label { font-size: 0.78rem; color: var(--text-secondary); margin-top: 4px; text-transform: uppercase; letter-spacing: 0.4px; }
        .ml-stat.high .ml-stat-val { color: #c5221f; }
        .ml-stat.medium .ml-stat-val { color: #b06000; }
        .ml-stat.low .ml-stat-val { color: #137333; }
        .ml-stat.avg .ml-stat-val { color: #1a73e8; }

        .risk-bar-wrap { display: flex; align-items: center; gap: 8px; }
        .risk-bar-bg { flex: 1; height: 8px; background: #f0f0f0; border-radius: 99px; overflow: hidden; min-width: 60px; }
        .risk-bar-fill { height: 100%; border-radius: 99px; transition: width 0.4s ease; }
        .risk-score-num { font-size: 0.85rem; font-weight: 700; min-width: 28px; text-align: right; }

        .ml-detail-card {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 18px;
            margin-top: 10px;
        }
        .ml-detail-header { font-size: 1.05rem; font-weight: 600; margin-bottom: 12px; display: flex; align-items: center; gap: 10px; }
        .ml-factor-row { display: flex; justify-content: space-between; font-size: 0.85rem; padding: 5px 0; border-bottom: 1px solid #ebebeb; }
        .ml-factor-row:last-child { border-bottom: none; }
        .ml-factor-label { color: var(--text-secondary); }
        .ml-factor-val { font-weight: 600; }
        .ml-strategy-list { margin-top: 12px; display: flex; flex-direction: column; gap: 7px; }
        .ml-strategy-item { background: white; border-radius: 7px; padding: 9px 13px; font-size: 0.83rem; line-height: 1.5; border-left: 3px solid #ccc; }
        .ml-strategy-item.high { border-left-color: #c5221f; }
        .ml-strategy-item.medium { border-left-color: #e6a817; }
        .ml-strategy-item.low { border-left-color: #0d904f; }

        .ml-filter-row { display: flex; gap: 10px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
        .ml-filter-btn { padding: 7px 16px; border: 2px solid var(--border); border-radius: 20px; background: white; cursor: pointer; font-size: 0.83rem; font-weight: 500; transition: var(--transition); }
        .ml-filter-btn:hover { border-color: var(--primary); color: var(--primary); }
        .ml-filter-btn.active-filter { background: var(--primary); color: white; border-color: var(--primary); }
        .ml-filter-btn.high-filter.active-filter { background: #c5221f; border-color: #c5221f; }
        .ml-filter-btn.medium-filter.active-filter { background: #e6a817; border-color: #e6a817; color: #1f1f1f; }
        .ml-filter-btn.low-filter.active-filter { background: #0d904f; border-color: #0d904f; }

        .score-breakdown-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
        .score-chip { background: #f0f0f0; border-radius: 6px; padding: 6px 10px; font-size: 0.78rem; }
        .score-chip-label { color: var(--text-secondary); }
        .score-chip-val { font-weight: 600; float: right; }

        .ml-manual-form { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .ml-manual-form .form-group { margin-bottom: 0; }
        .ml-result-box {
            border-radius: 10px;
            padding: 20px;
            margin-top: 16px;
            border: 2px solid #ebebeb;
        }
        .ml-result-box.high { background: #fce8e6; border-color: #c5221f; }
        .ml-result-box.medium { background: #fef7e0; border-color: #e6a817; }
        .ml-result-box.low { background: #e6f4ea; border-color: #0d904f; }
        .ml-result-title { font-size: 1.3rem; font-weight: 700; }
        .ml-result-score { font-size: 2.5rem; font-weight: 800; }

        @media (max-width: 768px) {
            .form-row { grid-template-columns: 1fr; }
            .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
            .navbar { flex-direction: column; gap: 10px; text-align: center; }
            .auth-card { padding: 25px; }
            .ml-manual-form { grid-template-columns: 1fr; }
            .score-breakdown-grid { grid-template-columns: 1fr; }
        }

        .gps-indicator {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
        }
        .gps-active { background: #e6f4ea; color: #137333; }
        .gps-inactive { background: #fce8e6; color: #c5221f; }
        .gps-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
        .gps-dot.active { background: #137333; animation: pulse 1.5s infinite; }
        .gps-dot.inactive { background: #c5221f; }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>

    <script type="text/babel">
        const { useState, useEffect, useCallback, useRef } = React;
        const API = axios.create({ baseURL: window.location.origin });

        API.interceptors.request.use(c => {
            const t = localStorage.getItem('token');
            if (t) c.headers.Authorization = `Bearer ${t}`;
            return c;
        });

        API.interceptors.response.use(r => r, e => {
            if (e.response?.status === 401) { localStorage.clear(); window.location.reload(); }
            return Promise.reject(e);
        });

        function PasswordInput({ value, onChange, placeholder = '••••••', required = false }) {
            const [show, setShow] = useState(false);
            return (
                <div className="password-wrapper">
                    <input className="form-input" type={show ? 'text' : 'password'} placeholder={placeholder}
                        required={required} value={value} onChange={onChange} autoComplete="current-password" />
                    <button type="button" className="password-toggle" onClick={() => setShow(s => !s)} tabIndex={-1}>
                        {show ? '🙈' : '👁️'}
                    </button>
                </div>
            );
        }

        class ErrorBoundary extends React.Component {
            state = { hasError: false, error: null };
            static getDerivedStateFromError(e) { return { hasError: true, error: e }; }
            render() {
                if (this.state.hasError) return (
                    <div className="auth-container">
                        <div className="auth-card text-center">
                            <h2>⚠️ Something went wrong</h2>
                            <p className="text-muted mt-2">{this.state.error?.message}</p>
                            <button className="btn btn-primary mt-3" onClick={() => window.location.reload()}>Reload</button>
                        </div>
                    </div>
                );
                return this.props.children;
            }
        }

        function App() {
            const [page, setPage] = useState('login');
            const [user, setUser] = useState(null);
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                const t = localStorage.getItem('token');
                const u = localStorage.getItem('user');
                if (t && u) { try { setUser(JSON.parse(u)); setPage('dashboard'); } catch(e) { localStorage.clear(); } }
                setLoading(false);
            }, []);

            const login = (u, t) => { localStorage.setItem('token', t); localStorage.setItem('user', JSON.stringify(u)); setUser(u); setPage('dashboard'); };
            const logout = () => { localStorage.clear(); setUser(null); setPage('login'); };

            if (loading) return <div className="auth-container"><div className="spinner"></div></div>;

            return (
                <ErrorBoundary>
                    {page === 'login' && <LoginPage onLogin={login} onRegister={() => setPage('register')} />}
                    {page === 'register' && <RegisterPage onSuccess={() => setPage('login')} onLogin={() => setPage('login')} />}
                    {page === 'dashboard' && user && <Dashboard user={user} onLogout={logout} setPage={setPage} />}
                    {page === 'admin' && user?.role === 'admin' && <AdminPanel user={user} onLogout={logout} setPage={setPage} />}
                    {page === 'collector' && user?.role === 'collector' && <CollectorPanel user={user} onLogout={logout} setPage={setPage} />}
                    {page === 'borrower' && user?.role === 'borrower' && <BorrowerPanel user={user} onLogout={logout} setPage={setPage} />}
                </ErrorBoundary>
            );
        }

        // ==================== LOGIN ====================
        function LoginPage({ onLogin, onRegister }) {
            const [form, setForm] = useState({ email: '', password: '' });
            const [error, setError] = useState('');
            const [loading, setLoading] = useState(false);

            const submit = async (e) => {
                e.preventDefault(); setLoading(true); setError('');
                try { const res = await API.post('/api/auth/login', form); onLogin(res.data.user, res.data.token); }
                catch (err) { setError(err.response?.data?.error || 'Login failed'); }
                finally { setLoading(false); }
            };

            return (
                <div className="auth-container">
                    <div className="auth-card">
                        <div className="text-center mb-2">
                            <div style={{ fontSize: '3rem', marginBottom: '10px' }}>📍</div>
                            <h1 style={{ background: 'linear-gradient(135deg, #667eea, #764ba2)', WebkitBackgroundClip: 'text', WebkitTextFillColor: 'transparent', fontSize: '1.8rem' }}>
                                GPS Debt Collection System
                            </h1>
                            <p className="text-muted">Sign in to your account</p>
                        </div>
                        {error && <div className="alert alert-error">❌ {error}</div>}
                        <form onSubmit={submit}>
                            <div className="form-group">
                                <label className="form-label">Email</label>
                                <input className="form-input" type="email" placeholder="Enter your email" required value={form.email} onChange={e => setForm({...form, email: e.target.value})} />
                            </div>
                            <div className="form-group">
                                <label className="form-label">Password</label>
                                <PasswordInput value={form.password} onChange={e => setForm({...form, password: e.target.value})} placeholder="Enter your password" required />
                            </div>
                            <button className="btn btn-primary btn-block btn-lg" type="submit" disabled={loading}>
                                {loading ? 'Signing in...' : '🔐 Sign In'}
                            </button>
                        </form>
                        <p className="text-center mt-3">Don't have an account?{' '}<a href="#" onClick={e => { e.preventDefault(); onRegister(); }} style={{ color: 'var(--primary)', fontWeight: 600 }}>Register</a></p>
                    </div>
                </div>
            );
        }

        // ==================== REGISTER ====================
        function RegisterPage({ onSuccess, onLogin }) {
            const [form, setForm] = useState({ name:'', email:'', password:'', confirmPassword:'', phone:'', street:'', barangay:'', city:'', province:'', zip_code:'', latitude: null, longitude: null });
            const [error, setError] = useState('');
            const [success, setSuccess] = useState('');
            const [loading, setLoading] = useState(false);
            const [gettingLocation, setGettingLocation] = useState(false);

            const getLocation = () => {
                if (!navigator.geolocation) { setError('Geolocation not supported'); return; }
                setGettingLocation(true);
                navigator.geolocation.getCurrentPosition(
                    (pos) => { setForm({...form, latitude: pos.coords.latitude, longitude: pos.coords.longitude}); setGettingLocation(false); setError(''); },
                    (err) => { setError('Failed to get location: ' + err.message); setGettingLocation(false); },
                    { enableHighAccuracy: true, timeout: 10000 }
                );
            };

            const submit = async (e) => {
                e.preventDefault(); setError(''); setSuccess('');
                if (!form.name || !form.email || !form.password) return setError('Name, email, and password are required');
                if (form.password.length < 6) return setError('Password must be at least 6 characters');
                if (form.password !== form.confirmPassword) return setError('Passwords do not match');
                if (!form.street || !form.barangay || !form.city) return setError('Please provide your complete address');
                setLoading(true);
                try {

        // ==================== ADMIN PANEL ====================
        function AdminPanel({ user, onLogout, setPage }) {
            const [tab, setTab] = useState('users');
            const [users, setUsers] = useState([]);
            const [borrowers, setBorrowers] = useState([]);
            const [loans, setLoans] = useState([]);
            const [payments, setPayments] = useState([]);
            const [collectors, setCollectors] = useState([]);
            const [assignments, setAssignments] = useState([]);
            const [gpsBorrowers, setGpsBorrowers] = useState([]);
            const [showLoanModal, setShowLoanModal] = useState(false);
            const [showAssignModal, setShowAssignModal] = useState(false);
            const [newLoan, setNewLoan] = useState({ borrower_id: '', loan_amount: '', interest_rate: '', due_date: '' });
            const [assignForm, setAssignForm] = useState({ collector_id: '', borrower_id: '' });
            const [msg, setMsg] = useState({});
            const [dismissing, setDismissing] = useState(false);

            useEffect(() => { loadData(); }, []);

            useEffect(() => {
                if (!msg.error && !msg.success) return;
                setDismissing(false);
                const timer = setTimeout(() => {
                    setDismissing(true);
                    setTimeout(() => { setMsg({}); setDismissing(false); }, 500);
                }, msg.success ? 4000 : 5000);
                return () => clearTimeout(timer);
            }, [msg]);

            const loadData = async () => {
                try {
                    const [u, b, l, p, c, a, g] = await Promise.all([
                        API.get('/api/users'), API.get('/api/borrowers'), API.get('/api/loans'),
                        API.get('/api/payments'), API.get('/api/collectors'), API.get('/api/assignments'),
                        API.get('/api/gps/borrowers')
                    ]);
                    setUsers(u.data); setBorrowers(b.data); setLoans(l.data);
                    setPayments(p.data); setCollectors(c.data); setAssignments(a.data);
                    setGpsBorrowers(g.data);
                } catch (e) { setMsg({ error: 'Failed to load data' }); }
            };

            const createLoan = async (e) => {
                e.preventDefault();
                try { await API.post('/api/loans', newLoan); setMsg({ success: 'Loan created!' }); setShowLoanModal(false); setNewLoan({ borrower_id: '', loan_amount: '', interest_rate: '', due_date: '' }); loadData(); }
                catch (e) { setMsg({ error: e.response?.data?.error || 'Failed' }); }
            };

            const assignCollector = async (e) => {
                e.preventDefault();
                try { await API.post('/api/assignments', assignForm); setMsg({ success: 'Collector assigned!' }); setShowAssignModal(false); loadData(); }
                catch (e) { setMsg({ error: e.response?.data?.error || 'Failed' }); }
            };

            const tabs = [
                { id: 'users', label: '👥 Users' },
                { id: 'borrowers', label: '🏠 Borrowers' },
                { id: 'loans', label: '💰 Loans' },
                { id: 'payments', label: '💳 Payments' },
                { id: 'assignments', label: '📋 Assignments' },
                { id: 'gps', label: '📍 GPS' },
                { id: 'ml', label: '🤖 ML Risk' },
            ];

            return (
                <div>
                    <nav className="navbar">
                        <span className="navbar-brand">📍 Admin Panel</span>
                        <div className="navbar-actions">
                            <button className="btn btn-outline btn-sm" onClick={() => setPage('dashboard')}>📊 Dashboard</button>
                            <button className="btn btn-danger btn-sm" onClick={onLogout}>🚪 Logout</button>
                        </div>
                    </nav>
                    <div className="container">
                        {msg.error && <div className={`alert alert-error ${dismissing ? 'dismissing' : ''}`}>❌ {msg.error}</div>}
                        {msg.success && <div className={`alert alert-success ${dismissing ? 'dismissing' : ''}`}>✅ {msg.success}</div>}

                        <div className="tabs">
                            {tabs.map(t => (
                                <button key={t.id} className={`tab ${tab === t.id ? 'active' : ''}`} onClick={() => setTab(t.id)}>{t.label}</button>
                            ))}
                        </div>

                        {/* ── USERS TAB ── */}
                        {tab === 'users' && (
                            <div className="card">
                                <div className="table-container">
                                    <table className="table">
                                        <thead><tr><th>Name</th><th>Email</th><th>Current Role</th><th>Status</th><th>Address</th><th>GPS</th><th>Action</th></tr></thead>
                                        <tbody>
                                            {users.map(u => (
                                                <tr key={u.user_id}>
                                                    <td>{u.name}</td>
                                                    <td>{u.email}</td>
                                                    <td>
                                                        {u.email === 'admin@system.com' ? (
                                                            <span className="badge badge-purple">{u.role}</span>
                                                        ) : (
                                                            <select className="form-select" style={{padding:'4px 8px',fontSize:'0.8rem',width:'130px'}} value={u.role}
                                                                onChange={async (e) => {
                                                                    try { await API.put(`/api/users/${u.user_id}/role`, { role: e.target.value }); setMsg({ success: 'Role updated!' }); loadData(); }
                                                                    catch (err) { setMsg({ error: err.response?.data?.error || 'Failed' }); }
                                                                }}>
                                                                <option value="pending_user">Pending User</option>
                                                                <option value="borrower">Borrower</option>
                                                                <option value="collector">Collector</option>
                                                                <option value="admin">Admin</option>
                                                            </select>
                                                        )}
                                                    </td>
                                                    <td><span className={`badge ${u.status==='approved'?'badge-success':u.status==='pending'?'badge-warning':'badge-danger'}`}>{u.status}</span></td>
                                                    <td style={{fontSize:'0.8rem'}}>{[u.street,u.barangay,u.city].filter(Boolean).join(', ')||'N/A'}</td>
                                                    <td>{u.latitude?<span className="gps-indicator gps-active"><span className="gps-dot active"></span> Yes</span>:<span className="gps-indicator gps-inactive"><span className="gps-dot inactive"></span> No</span>}</td>
                                                    <td>
                                                        {u.email !== 'admin@system.com' && u.status === 'pending' && (
                                                            <div style={{display:'flex',gap:'5px',flexDirection:'column'}}>
                                                                <select id={`role-${u.user_id}`} className="form-select" style={{padding:'4px 8px',fontSize:'0.75rem',width:'120px'}} defaultValue="borrower">
                                                                    <option value="borrower">As Borrower</option>
                                                                    <option value="collector">As Collector</option>
                                                                </select>
                                                                <button className="btn btn-success btn-sm" onClick={async () => {
                                                                    const sel = document.getElementById(`role-${u.user_id}`);
                                                                    try { const res = await API.put(`/api/users/${u.user_id}/status`, { status: 'approved', role: sel?.value || 'borrower' }); setMsg({ success: res.data.message || 'Approved!' }); loadData(); }
                                                                    catch (err) { setMsg({ error: err.response?.data?.error || 'Failed' }); }
                                                                }}>✅ Approve</button>
                                                                <button className="btn btn-danger btn-sm" onClick={async () => {
                                                                    try { await API.put(`/api/users/${u.user_id}/status`, { status: 'rejected' }); setMsg({ success: 'Rejected' }); loadData(); }
                                                                    catch (err) { setMsg({ error: 'Failed' }); }
                                                                }}>❌ Reject</button>
                                                            </div>
                                                        )}
                                                        {u.email !== 'admin@system.com' && u.status === 'rejected' && (
                                                            <button className="btn btn-success btn-sm" onClick={async () => {
                                                                const r = prompt('Assign role? (borrower/collector)', 'borrower');
                                                                if (r) {
                                                                    try { await API.put(`/api/users/${u.user_id}/status`, { status: 'approved', role: r }); setMsg({ success: 'Re-approved!' }); loadData(); }
                                                                    catch (err) { setMsg({ error: 'Failed' }); }
                                                                }
                                                            }}>Re-approve</button>
                                                        )}
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}

                        {/* ── BORROWERS TAB ── */}
                        {tab === 'borrowers' && (
                            <div className="card">
                                <div className="flex flex-between mb-2">
                                    <button className="btn btn-primary btn-sm" onClick={() => setShowLoanModal(true)}>💰 Create Loan</button>
                                    <button className="btn btn-warning btn-sm" onClick={() => { setAssignForm({...assignForm, borrower_id: ''}); setShowAssignModal(true); }}>👤 Assign Collector</button>
                                </div>
                                <div className="table-container">
                                    <table className="table">
                                        <thead><tr><th>Name</th><th>Address</th><th>GPS</th><th>Collector</th></tr></thead>
                                        <tbody>
                                            {borrowers.map(b => (
                                                <tr key={b.borrower_id}>
                                                    <td>{b.full_name}</td>
                                                    <td style={{fontSize:'0.8rem'}}>{[b.street, b.barangay, b.city].filter(Boolean).join(', ') || 'N/A'}</td>
                                                    <td>{b.latitude ? <span className="gps-indicator gps-active"><span className="gps-dot active"></span> Tracked</span> : 'N/A'}</td>
                                                    <td>{b.collector_name || <span className="text-muted">Unassigned</span>}</td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}

                        {/* ── LOANS TAB ── */}
                        {tab === 'loans' && (
                            <div className="card">
                                <div className="table-container">
                                    <table className="table">
                                        <thead><tr><th>ID</th><th>Borrower</th><th>Amount</th><th>Interest</th><th>Balance</th><th>Due Date</th><th>Status</th></tr></thead>
                                        <tbody>
                                            {loans.map(l => (
                                                <tr key={l.loan_id}>
                                                    <td>{l.loan_id}</td><td>{l.borrower_name}</td>
                                                    <td>₱{parseFloat(l.loan_amount).toLocaleString()}</td>
                                                    <td>{l.interest_rate}%</td>
                                                    <td>₱{parseFloat(l.balance).toLocaleString()}</td>
                                                    <td>{new Date(l.due_date).toLocaleDateString()}</td>
                                                    <td><span className={`badge ${l.status === 'active' ? 'badge-info' : l.status === 'paid' ? 'badge-success' : 'badge-danger'}`}>{l.status}</span></td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}

                        {/* ── PAYMENTS TAB ── */}
                        {tab === 'payments' && (
                            <div className="card">
                                <div className="table-container">
                                    <table className="table">
                                        <thead><tr><th>Receipt</th><th>Borrower</th><th>Collector</th><th>Amount</th><th>GPS</th><th>Date</th></tr></thead>
                                        <tbody>
                                            {payments.map(p => (
                                                <tr key={p.payment_id}>
                                                    <td style={{fontSize:'0.8rem'}}>{p.receipt_number}</td>
                                                    <td>{p.borrower_name}</td><td>{p.collector_name || 'N/A'}</td>
                                                    <td>₱{p.amount}</td>
                                                    <td>{p.latitude ? '📍' : '—'}</td>
                                                    <td>{new Date(p.payment_date).toLocaleString()}</td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}

                        {/* ── ASSIGNMENTS TAB ── */}
                        {tab === 'assignments' && (
                            <div className="card">
                                <div className="table-container">
                                    <table className="table">
                                        <thead><tr><th>Borrower</th><th>Collector</th><th>Status</th><th>Date</th></tr></thead>
                                        <tbody>
                                            {assignments.map(a => (
                                                <tr key={a.assignment_id}>
                                                    <td>{a.borrower_name}</td><td>{a.collector_name}</td>
                                                    <td><span className="badge badge-info">{a.status}</span></td>
                                                    <td>{new Date(a.assigned_date).toLocaleDateString()}</td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}

                        {/* ── GPS TAB ── */}
                        {tab === 'gps' && (
                            <div className="card">
                                <h4>📍 Borrower Locations</h4>
                                <div className="grid grid-2 mt-2">
                                    {gpsBorrowers.map(b => (
                                        <div key={b.borrower_id} className="card" style={{ background: '#f8f9fa' }}>
                                            <strong>{b.full_name}</strong>
                                            <p className="text-muted" style={{fontSize:'0.85rem'}}>{b.street}, {b.barangay}, {b.city}</p>
                                            <p style={{fontSize:'0.85rem'}}>📍 {b.latitude?.toFixed(6)}, {b.longitude?.toFixed(6)}</p>
                                            <a href={`https://www.google.com/maps?q=${b.latitude},${b.longitude}`} target="_blank" className="btn btn-outline btn-sm mt-1">🗺️ View on Map</a>
                                        </div>
                                    ))}
                                    {gpsBorrowers.length === 0 && <p className="text-muted">No borrower locations available</p>}
                                </div>
                            </div>
                        )}

                        {/* ── ML RISK TAB ── */}
                        {tab === 'ml' && (
                            <div className="card">
                                <div className="card-header" style={{ display: 'flex', alignItems: 'center', gap: '12px' }}>
                                    🤖 ML Risk Classification Engine
                                    <span style={{ fontSize: '0.75rem', background: '#e8f0fe', color: '#1967d2', padding: '3px 10px', borderRadius: '20px', fontWeight: 500 }}>
                                        6-Factor Weighted Model
                                    </span>
                                </div>
                                <div className="alert alert-info" style={{ marginBottom: '16px', fontSize: '0.85rem' }}>
                                    ℹ️ Risk scores are computed using Days Past Due (28%), Loan Utilization (20%), Payment Frequency (18%), Overdue Loans (15%), Debt Load (12%), and GPS Availability (7%).
                                </div>
                                <MLRiskDashboard />
                            </div>
                        )}
                    </div>

                    {/* Create Loan Modal */}
                    <div className={`modal-overlay ${showLoanModal ? 'active' : ''}`} onClick={e => { if (e.target === e.currentTarget) setShowLoanModal(false); }}>
                        <div className="modal">
                            <div className="modal-header"><h3>Create New Loan</h3><button className="modal-close" onClick={() => setShowLoanModal(false)}>×</button></div>
                            <form onSubmit={createLoan}>
                                <div className="form-group">
                                    <label className="form-label">Borrower</label>
                                    <select className="form-select" value={newLoan.borrower_id} onChange={e => setNewLoan({...newLoan, borrower_id: e.target.value})} required>
                                        <option value="">Select borrower</option>
                                        {borrowers.map(b => <option key={b.borrower_id} value={b.borrower_id}>{b.full_name}</option>)}
                                    </select>
                                </div>
                                <div className="form-row">
                                    <div className="form-group"><label className="form-label">Amount (₱)</label><input className="form-input" type="number" required value={newLoan.loan_amount} onChange={e => setNewLoan({...newLoan, loan_amount: e.target.value})} /></div>
                                    <div className="form-group"><label className="form-label">Interest Rate (%)</label><input className="form-input" type="number" required value={newLoan.interest_rate} onChange={e => setNewLoan({...newLoan, interest_rate: e.target.value})} /></div>
                                </div>
                                <div className="form-group"><label className="form-label">Due Date</label><input className="form-input" type="date" required value={newLoan.due_date} onChange={e => setNewLoan({...newLoan, due_date: e.target.value})} /></div>
                                <button className="btn btn-primary btn-block" type="submit">Create Loan</button>
                            </form>
                        </div>
                    </div>

                    {/* Assign Collector Modal */}
                    <div className={`modal-overlay ${showAssignModal ? 'active' : ''}`} onClick={e => { if (e.target === e.currentTarget) setShowAssignModal(false); }}>
                        <div className="modal">
                            <div className="modal-header"><h3>Assign Collector</h3><button className="modal-close" onClick={() => setShowAssignModal(false)}>×</button></div>
                            <form onSubmit={assignCollector}>
                                <div className="form-group">
                                    <label className="form-label">Borrower</label>
                                    <select className="form-select" value={assignForm.borrower_id} onChange={e => setAssignForm({...assignForm, borrower_id: e.target.value})} required>
                                        <option value="">Select borrower</option>
                                        {borrowers.filter(b => !b.collector_id).map(b => <option key={b.borrower_id} value={b.borrower_id}>{b.full_name}</option>)}
                                    </select>
                                </div>
                                <div className="form-group">
                                    <label className="form-label">Collector</label>
                                    <select className="form-select" value={assignForm.collector_id} onChange={e => setAssignForm({...assignForm, collector_id: e.target.value})} required>
                                        <option value="">Select collector</option>
                                        {collectors.map(c => <option key={c.user_id} value={c.user_id}>{c.name}</option>)}
                                    </select>
                                </div>
                                <button className="btn btn-primary btn-block" type="submit">Assign</button>
                            </form>
                        </div>
                    </div>
                </div>
            );
        }

        // ==================== COLLECTOR PANEL ====================
        function CollectorPanel({ user, onLogout, setPage }) {
            const [borrowers, setBorrowers] = useState([]);
            const [loans, setLoans] = useState([]);
            const [payAmount, setPayAmount] = useState({});
            const [gps, setGps] = useState({});

            useEffect(() => { loadData(); }, []);

            const loadData = async () => {
                try {
                    const [b, l] = await Promise.all([API.get('/api/borrowers'), API.get('/api/loans')]);
                    setBorrowers(b.data); setLoans(l.data);
                } catch (e) { console.error(e); }
            };

            const recordPayment = async (loanId) => {
                const amount = payAmount[loanId];
                if (!amount) return alert('Enter amount');
                try {
                    await API.post('/api/payments', { loan_id: loanId, amount: parseFloat(amount), latitude: gps.latitude, longitude: gps.longitude });
                    alert('Payment recorded!');
                    setPayAmount({...payAmount, [loanId]: ''});
                    loadData();
                } catch (e) { alert(e.response?.data?.error || 'Failed'); }
            };

            const getGps = () => {
                navigator.geolocation.getCurrentPosition(
                    pos => setGps({ latitude: pos.coords.latitude, longitude: pos.coords.longitude }),
                    err => alert('GPS error: ' + err.message),
                    { enableHighAccuracy: true }
                );
            };

            return (
                <div>
                    <nav className="navbar">
                        <span className="navbar-brand">📍 Collector Panel</span>
                        <div className="navbar-actions">
                            <span className={`gps-indicator ${gps.latitude ? 'gps-active' : 'gps-inactive'}`}>
                                <span className={`gps-dot ${gps.latitude ? 'active' : 'inactive'}`}></span>
                                {gps.latitude ? 'GPS Active' : 'GPS Inactive'}
                            </span>
                            <button className="btn btn-outline btn-sm" onClick={getGps}>📍 Get GPS</button>
                            <button className="btn btn-outline btn-sm" onClick={() => setPage('dashboard')}>📊 Dashboard</button>
                            <button className="btn btn-danger btn-sm" onClick={onLogout}>🚪 Logout</button>
                        </div>
                    </nav>
                    <div className="container">
                        <div className="card">
                            <h3>My Borrowers</h3>
                            <div className="table-container mt-2">
                                <table className="table">
                                    <thead><tr><th>Name</th><th>Address</th><th>GPS</th><th>Map</th></tr></thead>
                                    <tbody>
                                        {borrowers.map(b => (
                                            <tr key={b.borrower_id}>
                                                <td>{b.full_name}</td>
                                                <td>{[b.street, b.barangay, b.city].filter(Boolean).join(', ')}</td>
                                                <td>{b.latitude ? '📍' : '—'}</td>
                                                <td>{b.latitude && <a href={`https://www.google.com/maps?q=${b.latitude},${b.longitude}`} target="_blank" className="btn btn-outline btn-sm">🗺️ Map</a>}</td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                        <div className="card mt-3">
                            <h3>Active Loans</h3>
                            <div className="table-container mt-2">
                                <table className="table">
                                    <thead><tr><th>Borrower</th><th>Amount</th><th>Balance</th><th>Due Date</th><th>Payment</th></tr></thead>
                                    <tbody>
                                        {loans.filter(l => l.status === 'active').map(l => (
                                            <tr key={l.loan_id}>
                                                <td>{l.borrower_name}</td>
                                                <td>₱{parseFloat(l.loan_amount).toLocaleString()}</td>
                                                <td>₱{parseFloat(l.balance).toLocaleString()}</td>
                                                <td>{new Date(l.due_date).toLocaleDateString()}</td>
                                                <td>
                                                    <div style={{display:'flex', gap:'8px'}}>
                                                        <input type="number" className="form-input" style={{width:'100px', padding:'8px'}} placeholder="Amount"
                                                            value={payAmount[l.loan_id] || ''} onChange={e => setPayAmount({...payAmount, [l.loan_id]: e.target.value})} />
                                                        <button className="btn btn-success btn-sm" onClick={() => recordPayment(l.loan_id)}>Pay</button>
                                                    </div>
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // ==================== BORROWER PANEL ====================
        function BorrowerPanel({ user, onLogout, setPage }) {
            const [loans, setLoans] = useState([]);
            const [payments, setPayments] = useState([]);

            useEffect(() => { loadData(); }, []);

            const loadData = async () => {
                try {
                    const [l, p] = await Promise.all([API.get('/api/loans'), API.get('/api/payments')]);
                    setLoans(l.data); setPayments(p.data);
                } catch (e) { console.error(e); }
            };

            return (
                <div>
                    <nav className="navbar">
                        <span className="navbar-brand">📍 My Loans</span>
                        <div className="navbar-actions">
                            <button className="btn btn-outline btn-sm" onClick={() => setPage('dashboard')}>📊 Dashboard</button>
                            <button className="btn btn-danger btn-sm" onClick={onLogout}>🚪 Logout</button>
                        </div>
                    </nav>
                    <div className="container">
                        <div className="card">
                            <h3>My Loans</h3>
                            <div className="table-container mt-2">
                                <table className="table">
                                    <thead><tr><th>ID</th><th>Amount</th><th>Interest</th><th>Balance</th><th>Due Date</th><th>Status</th></tr></thead>
                                    <tbody>
                                        {loans.map(l => (
                                            <tr key={l.loan_id}>
                                                <td>{l.loan_id}</td>
                                                <td>₱{parseFloat(l.loan_amount).toLocaleString()}</td>
                                                <td>{l.interest_rate}%</td>
                                                <td>₱{parseFloat(l.balance).toLocaleString()}</td>
                                                <td>{new Date(l.due_date).toLocaleDateString()}</td>
                                                <td><span className={`badge ${l.status === 'active' ? 'badge-info' : 'badge-success'}`}>{l.status}</span></td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                        <div className="card mt-3">
                            <h3>Payment History</h3>
                            <div className="table-container mt-2">
                                <table className="table">
                                    <thead><tr><th>Receipt</th><th>Amount</th><th>Date</th></tr></thead>
                                    <tbody>
                                        {payments.map(p => (
                                            <tr key={p.payment_id}>
                                                <td>{p.receipt_number}</td>
                                                <td>₱{p.amount}</td>
                                                <td>{new Date(p.payment_date).toLocaleString()}</td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // ==================== RENDER ====================
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
